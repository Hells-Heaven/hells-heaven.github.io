<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Hells Heaven</title>
<meta name="description" content="Hells Heaven" />
<style>
  :root {
    --ember: #c2453a;
    --ember-bright: #ff6a4d;
    --gold: #b58a4a;
    --parch: #d8c9a4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Cinzel', 'Trajan Pro', Georgia, serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  /* ---------- Background layers ---------- */
  .bg {
    position: fixed; inset: 0;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }
  .bg-desktop { background-image: url('bg-desktop.jpg'); }
  .bg-mobile  { background-image: url('bg-mobile.jpg'); display: none; }

  @media (max-aspect-ratio: 1/1) {
    .bg-desktop { display: none; }
    .bg-mobile  { display: block; }
  }

  /* Vignette */
  .vignette {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.55) 80%, rgba(0,0,0,.85) 100%);
    pointer-events: none;
    z-index: 1;
  }

  #stars  { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  #embers { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  /* ---------- Scene container ---------- */
  /* Pinned to the top of the viewport at full viewport height — the logo lives here in every view.
     Pointer-events disabled so it never blocks dashboard scroll/click. */
  .scene {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100vh;
    z-index: 4;
    perspective: 1400px;
    perspective-origin: 50% 50%;
    pointer-events: none;
  }

  /* ---------- Logo cluster (positioned absolutely, transitions via transform/size) ---------- */
  /* Logo movement is the anchor of every transition between views.
     Long duration + soft ease-in-out so the eye follows it through the change.
     All positions use viewport units (vh/vw) so the reference frame is consistent. */
  .logo-cluster {
    position: absolute;
    top: 50vh;
    left: 50vw;
    width: min(72vmin, 760px);
    height: min(72vmin, 760px);
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    transition: transform 2.0s cubic-bezier(.65, 0, .35, 1),
                width     2.0s cubic-bezier(.65, 0, .35, 1),
                height    2.0s cubic-bezier(.65, 0, .35, 1),
                top       2.0s cubic-bezier(.65, 0, .35, 1),
                left      2.0s cubic-bezier(.65, 0, .35, 1);
  }
  body.view-lore .logo-cluster {
    width: min(46vmin, 460px);
    height: min(46vmin, 460px);
    top: 50vh;
    left: 19vw;
    transform: translate(-50%, -50%);
  }

  .ring {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.55;
    mix-blend-mode: screen;
  }
  .ring svg { width: 100%; height: 100%; display: block; }
  .ring-outer { animation: spin 90s linear infinite; }
  .ring-mid   { animation: spin 60s linear infinite reverse; width: 78%; height: 78%; opacity: .4; }
  .ring-inner { animation: spin 40s linear infinite; width: 56%; height: 56%; opacity: .35; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-wrap {
    position: relative;
    width: 84%; height: 84%;
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1);
  }

  .logo-glow {
    position: absolute;
    inset: -8%;
    background: radial-gradient(circle at center, rgba(194,69,58,.55) 0%, rgba(194,69,58,.18) 35%, transparent 65%);
    filter: blur(40px);
    animation: pulse 4.5s ease-in-out infinite;
    transform: translateZ(-60px);
    pointer-events: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: .55; transform: translateZ(-60px) scale(1); }
    50%      { opacity: .85; transform: translateZ(-60px) scale(1.08); }
  }

  .logo {
    position: relative;
    width: 100%; height: 100%;
    background: url('logo-clean.png') center / contain no-repeat;
    filter:
      drop-shadow(0 18px 28px rgba(0,0,0,.85))
      drop-shadow(0 0 28px rgba(194,69,58,.45))
      drop-shadow(0 0 60px rgba(194,69,58,.25));
    transform: translateZ(40px);
    animation: float 6.5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateZ(40px) translateY(0); }
    50%      { transform: translateZ(50px) translateY(-8px); }
  }

  /* ---------- Lore button (on landing) ---------- */
  .lore-btn {
    position: fixed;
    bottom: 6.5vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    padding: 14px 38px;
    background: linear-gradient(180deg, rgba(40,8,8,.55) 0%, rgba(20,4,4,.65) 100%);
    color: var(--parch);
    border: 1px solid rgba(194,69,58,.55);
    border-radius: 999px;
    font-family: inherit;
    font-size: clamp(12px, 1.6vmin, 16px);
    letter-spacing: .45em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 20px rgba(194,69,58,.25), inset 0 0 12px rgba(0,0,0,.55);
    transition: all .35s ease;
    text-decoration: none;
  }
  .lore-btn:hover {
    color: #fff;
    border-color: rgba(255,140,90,.9);
    box-shadow: 0 0 32px rgba(255,106,77,.55), inset 0 0 16px rgba(0,0,0,.65);
    transform: translateX(-50%) translateY(-2px);
  }

  /* ---------- Back button (on lore) ---------- */
  .back-btn {
    position: fixed;
    top: 22px; left: 22px;
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: rgba(20,6,6,.55);
    color: var(--parch);
    border: 1px solid rgba(194,69,58,.45);
    border-radius: 999px;
    font-family: inherit;
    font-size: clamp(10px, 1.3vmin, 13px);
    letter-spacing: .35em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all .25s ease;
    text-decoration: none;
  }
  .back-btn:hover {
    color: #fff;
    border-color: rgba(255,140,90,.85);
    box-shadow: 0 0 22px rgba(255,106,77,.45);
  }
  .back-btn svg { width: 14px; height: 14px; }

  /* ---------- Landing-only / Lore-only visibility ----------
     Default = the "entering" state: slow fade-in, delayed until after the logo has moved. */
  .landing-only { transition: opacity 1.1s ease 1.0s; }
  .lore-only    { transition: opacity 1.1s ease 1.0s; }
  /* Hidden state: fade out faster so old content gets out of the logo's way quickly. */
  body.view-landing .lore-only    { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  body.view-lore    .landing-only { opacity: 0; pointer-events: none; transition: opacity .45s ease; }

  /* ---------- Timeline ---------- */
  .timeline-wrap {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    left: 38vw;
    max-width: 760px;
    padding: 7vh 4vmin 6vh 4vmin;
    display: flex; flex-direction: column;
    pointer-events: auto;       /* scene above has pointer-events:none */
    transition: opacity 1.1s ease 1.0s;
  }
  .timeline-title {
    text-align: center;
    font-size: clamp(14px, 1.9vmin, 20px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: rgba(216,201,164,.75);
    margin-bottom: 2.2em;
    padding-left: .55em;
    text-shadow: 0 0 16px rgba(194,69,58,.45);
  }

  .timeline {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    padding: 1em 24px 4em 56px;
    scrollbar-width: thin;
    scrollbar-color: rgba(194,69,58,.55) transparent;
    mask-image: linear-gradient(180deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
  }
  .timeline::-webkit-scrollbar { width: 6px; }
  .timeline::-webkit-scrollbar-track { background: transparent; }
  .timeline::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(194,69,58,.55), rgba(120,20,12,.6));
    border-radius: 6px;
  }

  /* Inner track grows with content; the line sits on it so it spans every event */
  .timeline-track {
    position: relative;
    padding: 14px 0;
  }
  .timeline-track::before {
    content: "";
    position: absolute;
    /* Line center sits at the same x as the bullet center; -25px accounts for the 1px border on .ev */
    left: -25px;
    top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(180deg,
      rgba(194,69,58,.0) 0%,
      rgba(194,69,58,.7) 2%,
      rgba(194,69,58,.7) 98%,
      rgba(194,69,58,.0) 100%);
    box-shadow: 0 0 10px rgba(194,69,58,.55);
  }

  .ev {
    position: relative;
    padding: 14px 22px 14px 38px;
    margin-bottom: 14px;
    border: 1px solid rgba(194,69,58,.22);
    background: linear-gradient(135deg, rgba(20,4,4,.45), rgba(40,10,10,.25));
    border-radius: 10px;
    cursor: pointer;
    transition: transform .35s cubic-bezier(.2,.8,.2,1),
                border-color .35s ease,
                background .35s ease,
                box-shadow .35s ease;
    backdrop-filter: blur(2px);
  }
  .ev::before {
    /* Bullet on the line */
    content: "";
    position: absolute;
    left: -32px; top: 50%;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8a5a, #6a1a10 70%);
    box-shadow: 0 0 12px rgba(255,106,77,.85), 0 0 22px rgba(194,69,58,.4);
    transform: translateY(-50%);
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .ev::after {
    /* Connector line from bullet to card */
    content: "";
    position: absolute;
    left: -18px; top: 50%;
    width: 22px;
    height: 1px;
    background: linear-gradient(90deg, rgba(194,69,58,.55), transparent);
    transform: translateY(-50%);
  }

  .ev:hover {
    transform: translateX(6px);
    border-color: rgba(255,140,90,.7);
    background: linear-gradient(135deg, rgba(50,12,12,.6), rgba(80,20,12,.35));
    box-shadow: 0 0 26px rgba(194,69,58,.35);
  }
  .ev:hover::before {
    transform: translateY(-50%) scale(1.25);
    box-shadow: 0 0 18px rgba(255,150,100,1), 0 0 32px rgba(255,106,77,.6);
  }

  .ev .ev-name {
    font-size: clamp(13px, 1.7vmin, 17px);
    color: #f3e7d0;
    letter-spacing: .08em;
    line-height: 1.35;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .ev .ev-time {
    margin-top: 6px;
    font-size: clamp(10px, 1.25vmin, 12px);
    color: rgba(216,201,164,.6);
    letter-spacing: .3em;
    text-transform: uppercase;
    font-family: Georgia, serif;
    font-style: italic;
  }

  /* ---------- Locked / sealed event ---------- */
  .ev.locked {
    background: linear-gradient(135deg, rgba(14,3,3,.55), rgba(28,8,8,.30));
    border-color: rgba(120,90,40,.35);
    padding-right: 78px;            /* room for the seal band on the right */
  }
  .ev.locked .ev-name { color: rgba(216,201,164,.7); }
  .ev.locked .ev-time { color: rgba(216,201,164,.45); }

  /* Right-side seal band (vertical chain + padlock) */
  .chain-band {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 62px;
    pointer-events: none;
    overflow: hidden;
    border-top-right-radius: inherit;
    border-bottom-right-radius: inherit;
    background: linear-gradient(270deg, rgba(60,18,8,.45) 0%, rgba(60,18,8,0) 100%);
    border-left: 1px solid rgba(180,140,60,.18);
  }
  .chain-band svg {
    position: absolute;
    top: 50%; left: 50%;
    width: 20px; height: 100%;
    transform: translate(-50%, -50%);
    opacity: .55;
  }
  /* Padlock icon centered on the seal band */
  .seal-icon {
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    color: rgba(216,170,90,.9);
    filter: drop-shadow(0 0 8px rgba(194,69,58,.45));
    transition: transform .35s ease;
    pointer-events: none;
  }
  .seal-icon svg { width: 100%; height: 100%; }

  .ev.locked:hover {
    transform: translateX(4px);
    border-color: rgba(180,140,60,.7);
    background: linear-gradient(135deg, rgba(30,12,8,.55), rgba(50,18,10,.30));
    box-shadow: 0 0 22px rgba(120,90,40,.45);
  }
  .ev.locked:hover .seal-icon  { transform: translateY(-50%) rotate(-8deg) scale(1.08); }
  .ev.locked:hover .chain-band { background: linear-gradient(270deg, rgba(80,24,10,.6) 0%, rgba(80,24,10,0) 100%); }
  .ev.locked:hover .chain-band svg { opacity: .85; }

  /* ---------- Seal modal (mystical "unavailable" message) ---------- */
  .seal-modal {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,.85) 100%);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .55s ease;
  }
  .seal-modal.open { opacity: 1; pointer-events: auto; }
  .seal-card {
    position: relative;
    max-width: min(540px, 86vw);
    padding: 56px 48px 48px;
    text-align: center;
    background:
      radial-gradient(ellipse at top, rgba(60,16,12,.55) 0%, rgba(20,6,6,.85) 80%);
    border: 1px solid rgba(194,69,58,.55);
    border-radius: 10px;
    box-shadow:
      0 0 48px rgba(194,69,58,.4),
      0 0 90px rgba(120,30,12,.35),
      inset 0 0 36px rgba(0,0,0,.65);
    color: var(--parch);
    transform: scale(.92) translateY(8px);
    transition: transform .55s cubic-bezier(.2,.8,.2,1);
  }
  .seal-modal.open .seal-card { transform: scale(1) translateY(0); }

  /* Decorative corner sigils via pseudo-elements */
  .seal-card::before, .seal-card::after {
    content: "";
    position: absolute;
    width: 60px; height: 60px;
    border: 1px solid rgba(216,170,90,.55);
    border-radius: 2px;
  }
  .seal-card::before {
    top: 10px; left: 10px;
    border-right: none; border-bottom: none;
  }
  .seal-card::after {
    bottom: 10px; right: 10px;
    border-left: none; border-top: none;
  }

  .seal-glyph {
    width: 56px; height: 56px;
    margin: 0 auto 22px;
    color: rgba(255,170,110,.85);
    filter: drop-shadow(0 0 18px rgba(255,106,77,.55));
    animation: sealPulse 3.2s ease-in-out infinite;
  }
  .seal-glyph svg { width: 100%; height: 100%; }
  @keyframes sealPulse {
    0%, 100% { opacity: .65; filter: drop-shadow(0 0 12px rgba(255,106,77,.45)); }
    50%      { opacity: 1;   filter: drop-shadow(0 0 22px rgba(255,140,90,.75)); }
  }

  .seal-title {
    font-family: inherit;
    font-size: clamp(18px, 2.8vmin, 28px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 18px;
    text-shadow: 0 0 22px rgba(194,69,58,.65), 0 2px 6px rgba(0,0,0,.9);
    padding-left: .55em;
  }
  .seal-divider {
    width: 60%;
    height: 1px;
    margin: 4px auto 22px;
    background: linear-gradient(90deg, transparent, rgba(216,170,90,.6), transparent);
  }
  .seal-msg {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: clamp(13px, 1.7vmin, 17px);
    color: rgba(216,201,164,.85);
    line-height: 1.7;
    letter-spacing: .04em;
  }
  .seal-sub {
    margin-top: 18px;
    font-size: clamp(10px, 1.2vmin, 12px);
    letter-spacing: .4em;
    text-transform: uppercase;
    color: rgba(216,170,90,.55);
  }
  .seal-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 32px; height: 32px;
    background: none;
    border: 1px solid rgba(216,170,90,.5);
    border-radius: 50%;
    color: rgba(216,170,90,.85);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all .25s ease;
  }
  .seal-close:hover {
    background: rgba(194,69,58,.25);
    color: #fff;
    box-shadow: 0 0 14px rgba(255,106,77,.55);
  }

  /* ---------- Enter overlay (click to enter) ---------- */
  .enter {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,.92) 100%);
    backdrop-filter: blur(2px);
    z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 1.6s ease-out;
    color: rgba(255, 220, 200, .85);
    font-family: inherit;
    letter-spacing: .35em;
    text-transform: uppercase;
    user-select: none;
  }
  .enter.hidden { opacity: 0; pointer-events: none; }
  .enter .enter-title {
    font-size: clamp(14px, 2.2vmin, 22px);
    text-shadow: 0 0 18px rgba(194,69,58,.55), 0 2px 6px rgba(0,0,0,.9);
    animation: enterPulse 2.6s ease-in-out infinite;
    padding: .4em 0;
  }
  .enter .enter-sub {
    font-size: clamp(10px, 1.4vmin, 14px);
    margin-top: 1.4em;
    opacity: .55;
    letter-spacing: .5em;
  }
  @keyframes enterPulse {
    0%, 100% { opacity: .65; }
    50%      { opacity: 1;   }
  }

  /* ---------- Mute toggle ---------- */
  .mute-btn {
    position: fixed;
    bottom: 22px; right: 22px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(20, 6, 6, .55);
    border: 1px solid rgba(194, 69, 58, .55);
    color: rgba(255, 210, 180, .9);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 90;
    transition: background .25s, transform .25s, box-shadow .25s;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 18px rgba(194,69,58,.25);
  }
  .mute-btn:hover {
    background: rgba(40, 10, 10, .8);
    transform: scale(1.08);
    box-shadow: 0 0 26px rgba(194,69,58,.6);
  }
  .mute-btn svg { width: 22px; height: 22px; }

  /* ========================================================
     HH DASHBOARD (view-hh1 .. view-hh6)
     ======================================================== */

  /* Show dashboard only on hh-* views */
  .dashboard-only { transition: opacity 1.1s ease 1.0s; }   /* fade in after logo arrives */
  body.view-landing .dashboard-only,
  body.view-lore    .dashboard-only { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  body[class*="view-hh"] .landing-only,
  body[class*="view-hh"] .lore-only { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  /* Logo position on dashboard views — uses viewport units to match landing/lore reference frame. */
  body[class*="view-hh"] .logo-cluster {
    top: 16vh;
    left: 50vw;
    width: min(22vmin, 260px);
    height: min(22vmin, 260px);
    transform: translate(-50%, -50%);
  }
  /* Allow page to scroll on dashboard views */
  body[class*="view-hh"] { overflow-y: auto; overflow-x: hidden; }

  .dashboard {
    position: relative;
    z-index: 5;
    width: 100%;
    min-height: 100vh;
    color: #f3e7d0;
    opacity: 0;
    transition: opacity 1.1s ease 1.0s;   /* arrives as the logo finishes its journey */
  }
  body[class*="view-hh"] .dashboard { opacity: 1; }

  /* ---------- HH Hero Header ---------- */
  .hh-header {
    padding: 32vh 4vmin 6vh;   /* leave room for the fixed logo cluster at the top */
    text-align: center;
    position: relative;
  }
  .hh-number {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(13px, 1.7vmin, 17px);
    letter-spacing: .85em;
    color: rgba(216,170,90,.85);
    padding-left: .85em;
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(194,69,58,.5);
  }
  .hh-title {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 600;
    font-size: clamp(28px, 5.2vmin, 56px);
    margin: 26px 0 22px;
    letter-spacing: .04em;
    color: #fff;
    line-height: 1.15;
    text-shadow:
      0 0 28px rgba(194,69,58,.65),
      0 0 56px rgba(120,30,12,.4),
      0 2px 8px rgba(0,0,0,.9);
    max-width: 1100px;
    margin-left: auto; margin-right: auto;
  }
  .hh-title-row { margin: 26px auto 22px; }
  .hh-time {
    font-family: Georgia, serif;
    font-style: italic;
    letter-spacing: .35em;
    color: rgba(216,170,90,.7);
    font-size: clamp(12px, 1.45vmin, 15px);
  }
  .hh-header-flourish {
    width: 60%;
    max-width: 360px;
    height: 1px;
    margin: 38px auto 0;
    background: linear-gradient(90deg, transparent, rgba(216,170,90,.6), transparent);
    position: relative;
  }
  .hh-header-flourish::before {
    content: "✦";
    position: absolute; top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    color: rgba(216,170,90,.85);
    text-shadow: 0 0 18px rgba(255,140,90,.7), 0 0 6px rgba(0,0,0,.85);
  }

  /* ---------- Sections ---------- */
  .hh-section {
    padding: 7vh 5vmin;
    max-width: 960px;
    margin: 0 auto;
    position: relative;
  }
  .hh-section + .hh-section { padding-top: 4vh; }
  .hh-section-title {

  /* ---------- Lore prose ---------- */
  .lore-text {

  /* ---------- Setting (simple legendary text) ---------- */
  .setting-text {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(20px, 3.2vmin, 34px);
    letter-spacing: .35em;
    text-transform: uppercase;

    text-align: center;
    padding-left: .35em;

      0 0 22px rgba(255,140,90,.5),

      0 2px 8px rgba(0,0,0,.9);

  .setting-text .ampersand {

    font-family: Georgia, serif;
    font-style: italic;
    margin: 0 .4em;

  /* ---------- Setting locations (stacked) ---------- */
  .setting-locations {
    list-style: none;
    padding: 0;
    margin: 0 auto;
    text-align: center;

    font-size: clamp(16px, 2.2vmin, 22px);

    color: #f3e7d0;
    line-height: 2.3;

  .setting-locations li {
    position: relative;

      0 0 18px rgba(255,140,90,.45),

  .setting-locations li + li::before {
    content: "✦";
    position: absolute;
    top: -1.05em;
    left: 50%;
    transform: translateX(-50%);
    font-size: .55em;
    color: rgba(216,170,90,.45);
    text-shadow: 0 0 12px rgba(216,170,90,.4);

  /* ---------- Status: Ongoing ---------- */
  .status-ongoing {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4em;
    padding: 2em 0;
  }
  .status-ongoing-label {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(24px, 3.6vmin, 38px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: #f3e7d0;
    display: flex;
    align-items: center;
    gap: .9em;
    text-shadow:
      0 0 24px rgba(255,140,90,.55),
      0 0 48px rgba(194,69,58,.3),
      0 2px 8px rgba(0,0,0,.9);

  .status-pulse {
    width: .55em;
    height: .55em;
    border-radius: 50%;
    background: #ff6a4d;
    box-shadow:
      0 0 12px #ff6a4d,
      0 0 28px rgba(255,106,77,.7),

  @keyframes statusPulse {

  .status-ongoing-note {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: clamp(13px, 1.6vmin, 16px);

    line-height: 1.7;

  /* ---------- Cast (Houses / Participants + Roles) ---------- */
  .cast-factions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6vmin;
    max-width: 1080px;
    margin: 0 auto;

  .cast-factions[data-factions="3"] {
    grid-template-columns: 1fr 1fr 1fr;

  .cast-faction {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .cast-faction-sigil {

  .cast-faction-sigil img { width: 100%; height: 100%; object-fit: contain; }

  .cast-faction-sigil.sigil-inline svg { width: 100%; height: 100%; }
  .faction-angel    { --accent: rgba(216,170,60,.7);  --glow: rgba(255,210,90,.55); }
  .faction-devil    { --accent: rgba(194,69,58,.7);   --glow: rgba(255,106,77,.55); }
  .faction-royalist { --accent: rgba(200,210,220,.7); --glow: rgba(220,230,240,.55); }
  .faction-rebel    { --accent: rgba(194,69,58,.7);   --glow: rgba(255,106,77,.55); }
  .faction-neutral  { --accent: rgba(180,140,210,.7); --glow: rgba(210,170,240,.55); }
  .faction-titan    { --accent: rgba(120,180,230,.7); --glow: rgba(140,210,255,.55); }
  .faction-angel    .cast-faction-sigil,
  .faction-devil    .cast-faction-sigil,
  .faction-royalist .cast-faction-sigil,
  .faction-rebel    .cast-faction-sigil,
  .faction-neutral  .cast-faction-sigil,
  .faction-titan    .cast-faction-sigil { filter: drop-shadow(0 0 20px var(--glow)); }
  .cast-faction-name {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(15px, 2vmin, 21px);
    letter-spacing: .55em;
    text-transform: uppercase;
    padding-left: .55em;
    text-shadow: 0 0 18px var(--glow);
  }
  .faction-angel    .cast-faction-name { color: #f5e8b8; }
  .faction-devil    .cast-faction-name { color: #f3c4b8; }
  .faction-royalist .cast-faction-name { color: #e8eef5; }
  .faction-rebel    .cast-faction-name { color: #f3c4b8; }
  .faction-neutral  .cast-faction-name { color: #e0cff0; }
  .faction-titan    .cast-faction-name { color: #cfe5f8; }

  .cast-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    width: 100%;
  }
  .player-card {
    display: flex; flex-direction: column;
    padding: 12px 18px;
    background: linear-gradient(135deg, rgba(20,4,4,.55), rgba(40,10,10,.25));
    border: 1px solid var(--accent);
    border-left-width: 3px;
    border-radius: 6px;
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease, background .3s ease;
  }
  .player-card:hover {
    transform: translateX(4px);
    background: linear-gradient(135deg, rgba(40,12,8,.6), rgba(60,18,10,.3));
    box-shadow: 0 0 22px var(--glow);
  }
  .player-card .role {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 10px;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: rgba(216,170,90,.75);
  }
  .player-card .tag {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(15px, 1.9vmin, 19px);
    color: #f3e7d0;
    margin-top: 4px;
    letter-spacing: .03em;
    text-shadow: 0 0 12px var(--glow);
  }
  /* Special highlight cards for headline roles */
  .player-card.headline {
    background: linear-gradient(135deg, rgba(60,18,12,.65), rgba(40,10,10,.3));
    border-color: var(--glow);
    box-shadow: inset 0 0 18px rgba(0,0,0,.4);
  }
  .player-card.headline .role { color: var(--glow); }

  /* ---------- Winning faction treatment ---------- */
  /* Sigil glow is unchanged from default. Name stays aligned with the losing faction's name;
     crown and "Victors" label are absolutely-positioned overlays so they add no vertical height. */
  .cast-faction.winner { --victor: rgba(255,200,110,.85); --victor-soft: rgba(255,180,80,.4); }
  .cast-faction.winner .cast-faction-name {
    position: relative;
  }
  .cast-faction.winner .faction-name-text {
    color: #fff8e8;
    text-shadow:
      0 0 22px var(--victor),
      0 0 44px var(--victor-soft),
      0 2px 8px rgba(0,0,0,.9);
  }
  .faction-crown {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    width: 38px;
    height: 22px;
    margin-bottom: 8px;
    color: var(--victor);
    filter: drop-shadow(0 0 10px var(--victor-soft));
    pointer-events: none;
  }
  .faction-crown svg { width: 100%; height: 100%; display: block; }
  .faction-victors {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 8px;
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(10px, 1.25vmin, 12px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: var(--victor);
    padding-left: .55em;
    text-shadow: 0 0 18px var(--victor-soft);
    white-space: nowrap;
    pointer-events: none;
  }

  /* Victor player cards — slightly more 3D. Border/text colors stay with the faction palette;
     winner state adds depth shadows + a soft top highlight that feels lifted from the page. */
  .cast-faction.winner .player-card {
    box-shadow:
      0 6px 16px rgba(0,0,0,.55),
      0 2px 4px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 -1px 0 rgba(0,0,0,.35),
      0 0 22px var(--glow);

  }
  .cast-faction.winner .player-card:hover {
    transform: translateX(4px) translateY(-2px);
    box-shadow:
      0 10px 24px rgba(0,0,0,.6),
      0 3px 6px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -1px 0 rgba(0,0,0,.4),
      0 0 30px var(--glow);
  }

  /* ---------- MVP logo section title ---------- */
  .mvp-section-logo {
    width: 100%;
    text-align: center;
    margin-bottom: 28px;
  }
  .mvp-section-logo img {
    width: clamp(220px, 30vmin, 360px);
    height: auto;
    display: inline-block;
    animation: floatGently 5.2s ease-in-out infinite;
    filter:
      drop-shadow(0 10px 18px rgba(0,0,0,.85))
      drop-shadow(0 0 30px rgba(255,106,77,.65))
      drop-shadow(0 0 58px rgba(194,69,58,.4));
  }
  .mvp-section-logo::after {
    content: "";
    display: block;
    width: 240px; max-width: 60%;
    height: 1px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, rgba(216,170,90,.55), transparent);
  }

  /* ---------- MVP cards ---------- */
  .mvp-list {
    display: flex; flex-direction: column;
    gap: 36px;
    max-width: 780px;
    margin: 36px auto 0;
  }
  .mvp-card {
    position: relative;
    padding: 38px 36px;
    border: 1px solid rgba(216,170,90,.35);
    border-radius: 12px;
    background:
      radial-gradient(ellipse at top, rgba(70,18,12,.55) 0%, rgba(14,4,4,.55) 65%, rgba(8,2,2,.65) 100%);
    text-align: center;
    box-shadow:
      0 0 50px rgba(194,69,58,.18),
      inset 0 0 30px rgba(0,0,0,.45);
    backdrop-filter: blur(2px);
  }
  .mvp-card::before, .mvp-card::after {
    content: "";
    position: absolute;
    width: 56px; height: 56px;
    border: 1px solid rgba(216,170,90,.4);
    border-radius: 2px;
  }
  .mvp-card::before {
    top: 10px; left: 10px;
    border-right: none; border-bottom: none;
  }
  .mvp-card::after {
    bottom: 10px; right: 10px;
    border-left: none; border-top: none;
  }

  /* ---------- Rank tiers ---------- */
  .mvp-rank {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-bottom: 18px;
    line-height: 1;
  }
  .mvp-rank-label {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(10px, 1.25vmin, 12px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: rgba(216,170,90,.75);
    padding-left: .55em;
  }
  .mvp-rank-numeral {
    font-family: 'Trajan Pro', Georgia, serif;
    font-weight: 700;
    line-height: 1;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }

  /* TOP I  — supreme: bigger card, bigger numeral, brightest glow */
  .mvp-rank-1 {
    padding: 56px 44px 48px;
    border-color: rgba(255,170,80,.65);
    background:
      radial-gradient(ellipse at top, rgba(120,32,18,.65) 0%, rgba(40,10,8,.6) 60%, rgba(8,2,2,.7) 100%);
    box-shadow:
      0 0 70px rgba(255,140,90,.35),
      0 0 130px rgba(194,69,58,.25),
      inset 0 0 36px rgba(0,0,0,.45);
  }
  .mvp-rank-1 .mvp-rank-label { color: rgba(255,210,140,1); text-shadow: 0 0 18px rgba(255,140,90,.7); }
  .mvp-rank-1 .mvp-rank-numeral {
    font-size: clamp(48px, 8vmin, 88px);
    background-image: linear-gradient(180deg, #ffd98a 0%, #f0a64a 40%, #c45a2a 100%);
    filter: drop-shadow(0 0 24px rgba(255,160,80,.7));
  }
  .mvp-rank-1 .mvp-tag {
    font-size: clamp(26px, 4vmin, 40px);
    text-shadow:
      0 0 28px rgba(255,180,120,.85),
      0 0 56px rgba(194,69,58,.55),
      0 2px 8px rgba(0,0,0,.9);

  /* TOP II — secondary */
  .mvp-rank-2 {
    border-color: rgba(216,170,90,.5);

      radial-gradient(ellipse at top, rgba(70,18,12,.5) 0%, rgba(14,4,4,.55) 65%, rgba(8,2,2,.65) 100%);
  }
  .mvp-rank-2 .mvp-rank-numeral {
    font-size: clamp(36px, 6vmin, 64px);
    background-image: linear-gradient(180deg, #f3d8a0 0%, #b58a4a 50%, #6b4624 100%);

  /* TOP III — tertiary, slightly subdued */
  .mvp-rank-3 {
    border-color: rgba(180,140,60,.35);

      radial-gradient(ellipse at top, rgba(40,12,8,.5) 0%, rgba(12,4,4,.55) 70%, rgba(6,2,2,.65) 100%);

  .mvp-rank-3 .mvp-rank-numeral {

  .mvp-tag {

  .mvp-meta {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(10px, 1.2vmin, 12px);

    color: rgba(216,170,90,.75);
    margin-bottom: 28px;
    padding-left: .45em;
  }
  .mvp-meta .meta-dot {
    display: inline-block;

    border-radius: 50%;

  }
  .mvp-text {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: clamp(14px, 1.75vmin, 18px);
    line-height: 1.85;
    color: rgba(243,231,208,.92);
    max-width: 660px;
    margin: 0 auto;
    text-align: justify;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
  }

  /* ---------- Dashboard back button (top-left) ---------- */
  .dash-back {
    position: fixed;
    top: 22px; left: 22px;
    z-index: 80;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: rgba(20,6,6,.6);
    color: var(--parch);
    border: 1px solid rgba(194,69,58,.5);
    border-radius: 999px;
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(10px, 1.3vmin, 13px);

  .dash-back:hover {

  .dash-back svg { width: 14px; height: 14px; }

  /* Footer space so last MVP isn't crammed at viewport edge */
  .dash-foot { padding: 7vh 4vmin 6vh; text-align: center; }
  .dash-foot::before {
    content: "✦";
    display: block;
    font-size: 16px;
    color: rgba(216,170,90,.5);
    text-shadow: 0 0 14px rgba(255,106,77,.4);
  }

  @keyframes floatGently {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }

  /* ---------- Mobile (portrait) ---------- */
  @media (max-aspect-ratio: 1/1) {
    body.view-lore .logo-cluster {
      width: min(38vmin, 320px);
      height: min(38vmin, 320px);

    .timeline-wrap {

    /* Dashboard mobile */
    body[class*="view-hh"] .logo-cluster {

      height: min(34vmin, 240px);

    .cast-faction-sigil, .mvp-section-logo img { animation: none; }
  }

  function renderDashboard(hhKey) {
    const data = HH_DATA[hhKey];
    const dash = document.getElementById('dashboard');
    if (!data) {
      dash.innerHTML = `
        <div class="hh-header">
          <div class="hh-number">${hhKey.toUpperCase()}</div>
          <h1 class="hh-title">The Chronicle is Being Inscribed</h1>
          <div class="hh-time">Soon</div>
          <div class="hh-header-flourish"></div>
        </div>
        <div class="hh-section">
          <p class="lore-text" style="text-align:center">Return when the ink has dried.</p>
        </div>
        <div class="dash-foot"></div>`;
      return;
    }

    const CROWN_SVG = `
      <svg viewBox="0 0 64 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
          <path d="M6 30 L10 14 L20 22 L32 6 L44 22 L54 14 L58 30 Z"/>
          <circle cx="10" cy="13" r="2.4"/>
          <circle cx="32" cy="5"  r="2.6"/>
          <circle cx="54" cy="13" r="2.4"/>
          <rect x="6" y="29" width="52" height="3" rx="1"/>
        </g>
      </svg>`;

    // Inline ornamental sigil for factions without a custom image (e.g. Neutral / Fool).
    const NEUTRAL_SIGIL_SVG = `
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="ngrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(220,190,255,.95)"/>
            <stop offset="60%" stop-color="rgba(140,90,200,.55)"/>
            <stop offset="100%" stop-color="rgba(60,30,90,.0)"/>
          </radialGradient>
        </defs>
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
          <circle cx="50" cy="50" r="44"/>
          <circle cx="50" cy="50" r="34" stroke-dasharray="2 4"/>
        </g>
        <g fill="currentColor" stroke="none">
          <path d="M50 8  L54 30 L72 22 L60 38 L82 42 L60 46 L70 64 L52 54 L50 78 L48 54 L30 64 L40 46 L18 42 L40 38 L28 22 L46 30 Z"/>
        </g>
        <circle cx="50" cy="50" r="6" fill="url(#ngrad)"/>
      </svg>`;

    const factionsHtml = (data.factions || []).map(f => {
      const sigilHtml = f.sigil === null
        ? `<div class="cast-faction-sigil sigil-inline">${NEUTRAL_SIGIL_SVG}</div>`
        : `<div class="cast-faction-sigil"><img src="sigil-${f.sigil || f.key}.png" alt="${f.name} sigil"></div>`;
      return `
      <div class="cast-faction faction-${f.key}${f.winner ? ' winner' : ''}">
        ${sigilHtml}
        <div class="cast-faction-name">
          ${f.winner ? `<div class="faction-crown">${CROWN_SVG}</div>` : ''}
          <span class="faction-name-text">${f.name}</span>
          ${f.winner ? `<div class="faction-victors">Victors</div>` : ''}
        </div>
        <div class="cast-grid">
          ${f.members.map(m => `
            <div class="player-card${m.headline ? ' headline' : ''}">
              <span class="role">${m.role}</span>
              <span class="tag">${m.tag}</span>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('');

    const mvpsHtml = (data.mvps || []).map(m => `
      <article class="mvp-card mvp-rank-${m.rank}">
        <div class="mvp-rank">
          <span class="mvp-rank-label">Top</span>
          <span class="mvp-rank-numeral">${m.rankNumeral}</span>
        </div>
        <h3 class="mvp-tag">${m.tag}</h3>
        <div class="mvp-meta">${m.faction}<span class="meta-dot"></span>${m.role}</div>
        <p class="mvp-text">${m.text}</p>
      </article>`).join('');

    const loreOrStatusHtml = data.ongoing
      ? `
      <section class="hh-section">
        <h2 class="hh-section-title">Status</h2>
        <div class="status-ongoing">
          <div class="status-ongoing-label">
            <span class="status-pulse"></span>
            <span>Ongoing</span>
          </div>
          <div class="status-ongoing-note">The chronicle is still being written. Return when the ink has dried.</div>
        </div>
      </section>`
      : `
      <section class="hh-section">
        <h2 class="hh-section-title">Lore</h2>
        <p class="lore-text">${data.lore}</p>
      </section>`;

    const settingInner = (data.settingLocations && data.settingLocations.length)
      ? `<ul class="setting-locations">${data.settingLocations.map(loc => `<li>${loc}</li>`).join('')}</ul>`
      : `<div class="setting-text">${data.settingText || 'Heaven <span class="ampersand">&amp;</span> Hell'}</div>`;

    dash.innerHTML = `
      <header class="hh-header">
        <div class="hh-number">${data.number}</div>
        <div class="hh-title-row">
          <h1 class="hh-title">${data.title}</h1>
        </div>
        <div class="hh-time">${data.time}</div>
        <div class="hh-header-flourish"></div>
      </header>

      ${loreOrStatusHtml}

      <section class="hh-section">
        <h2 class="hh-section-title">Setting</h2>
        ${settingInner}
      </section>

      ${(data.factions && data.factions.length) ? `
      <section class="hh-section">
        <h2 class="hh-section-title">Factions</h2>
        <div class="cast-factions" data-factions="${data.factions.length}">${factionsHtml}</div>
      </section>` : ''}

      ${(data.mvps && data.mvps.length) ? `
      <section class="hh-section">
        <div class="mvp-section-logo"><img src="sigil-mvp.png" alt="MVPs"></div>
        <div class="mvp-list">${mvpsHtml}</div>
      </section>` : ''}

      <div class="dash-foot"></div>`;
  }

  // ---------- View routing (hash) ----------
  function applyView() {
    const hash = window.location.hash.replace('#', '').toLowerCase();
    const isLore = hash === 'lore';
    const hhMatch = hash.match(/^hh([1-6])$/);

    // Clear all view classes
    ['view-landing','view-lore','view-hh1','view-hh2','view-hh3','view-hh4','view-hh5','view-hh6']
      .forEach(c => document.body.classList.remove(c));

    if (hhMatch) {
      const key = 'hh' + hhMatch[1];
      document.body.classList.add('view-' + key);
      renderDashboard(key);
      document.body.scrollTop = 0; window.scrollTo(0, 0);
    } else if (isLore) {
      document.body.classList.add('view-lore');
      document.body.scrollTop = 0; window.scrollTo(0, 0);
    } else {
      document.body.classList.add('view-landing');
      document.body.scrollTop = 0; window.scrollTo(0, 0);
    }

    // a11y
    document.querySelectorAll('.lore-only').forEach(el => el.setAttribute('aria-hidden', isLore ? 'false' : 'true'));
    document.querySelectorAll('.landing-only').forEach(el => el.setAttribute('aria-hidden', (isLore || hhMatch) ? 'true' : 'false'));
    document.querySelectorAll('.dashboard-only').forEach(el => el.setAttribute('aria-hidden', hhMatch ? 'false' : 'true'));
  }
  window.addEventListener('hashchange', applyView);
  applyView();

  // ---------- Click-to-enter + audio ----------
  const enterEl = document.getElementById('enter');
  const bgm     = document.getElementById('bgm');
  const muteBtn = document.getElementById('muteBtn');

  const ICON_ON = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>`;
  const ICON_OFF = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>`;
  function updateMuteIcon() {
    muteBtn.innerHTML = bgm.muted ? ICON_OFF : ICON_ON;
    muteBtn.setAttribute('aria-label', bgm.muted ? 'Unmute' : 'Mute');
    muteBtn.setAttribute('title',     bgm.muted ? 'Unmute' : 'Mute');
  }

  function enterScene() {
    if (enterEl.classList.contains('hidden')) return;
    enterEl.classList.add('hidden');
    setTimeout(() => enterEl.remove(), 1800);
    bgm.volume = 0.6;
    bgm.play().catch(() => { /* mute button still works */ });
    muteBtn.style.display = 'flex';
    updateMuteIcon();
  }
  enterEl.addEventListener('click', enterScene);
  window.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') enterScene();
  });
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    bgm.muted = !bgm.muted;
    if (!bgm.muted && bgm.paused) bgm.play().catch(()=>{});
    updateMuteIcon();
  });

  // ---------- 3D parallax tilt on logo ----------
  const wrap = document.getElementById('logoWrap');
  const bgs = document.querySelectorAll('.bg');

  let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;
  let targetBX = 0, targetBY = 0, curBX = 0, curBY = 0;

  function onMove(x, y) {
    const w = window.innerWidth, h = window.innerHeight;
    const nx = (x / w) * 2 - 1;
    const ny = (y / h) * 2 - 1;
    targetRY =  nx * 14;
    targetRX = -ny * 10;
    targetBX = -nx * 18;
    targetBY = -ny * 14;
  }
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null || e.beta == null) return;
    const gx = Math.max(-30, Math.min(30, e.gamma)) / 30;
    const gy = Math.max(-30, Math.min(30, e.beta - 45)) / 30;
    targetRY =  gx * 14;
    targetRX = -gy * 10;
    targetBX = -gx * 18;
    targetBY = -gy * 14;
  });

  function animateTilt() {
    curRX += (targetRX - curRX) * 0.08;
    curRY += (targetRY - curRY) * 0.08;
    curBX += (targetBX - curBX) * 0.06;
    curBY += (targetBY - curBY) * 0.06;
    wrap.style.transform = `rotateX(${curRX.toFixed(2)}deg) rotateY(${curRY.toFixed(2)}deg)`;
    bgs.forEach(b => {
      b.style.transform = `translate3d(${curBX.toFixed(1)}px, ${curBY.toFixed(1)}px, 0) scale(1.05)`;
    });
    requestAnimationFrame(animateTilt);
  }
  requestAnimationFrame(animateTilt);

  // ---------- Starfield ----------
  const starCanvas = document.getElementById('stars');
  const sctx = starCanvas.getContext('2d');
  let stars = [];
  function sizeCanvas(c) {
    c.width = window.innerWidth * devicePixelRatio;
    c.height = window.innerHeight * devicePixelRatio;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
  }
  function initStars() {
    sizeCanvas(starCanvas);
    const count = Math.floor((window.innerWidth * window.innerHeight) / 9000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * starCanvas.width,
      y: Math.random() * starCanvas.height,
      r: Math.random() * 1.2 * devicePixelRatio + 0.2,
      a: Math.random() * 0.6 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.8,
      tint: Math.random() < 0.15
    }));
  }
  function drawStars(t) {
    sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
    for (const s of stars) {
      const tw = (Math.sin(t * 0.001 * s.speed + s.phase) + 1) / 2;
      const alpha = s.a * (0.4 + tw * 0.6);
      sctx.beginPath();
      sctx.fillStyle = s.tint
        ? `rgba(255, 140, 110, ${alpha})`
        : `rgba(255, 230, 210, ${alpha})`;
      sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      sctx.fill();
    }
  }

  // ---------- Embers ----------
  const emberCanvas = document.getElementById('embers');
  const ectx = emberCanvas.getContext('2d');
  let embers = [];
  function spawnEmber() {
    return {
      x: Math.random() * emberCanvas.width,
      y: emberCanvas.height + Math.random() * 50,
      vx: (Math.random() - 0.5) * 0.3 * devicePixelRatio,
      vy: -(0.3 + Math.random() * 0.7) * devicePixelRatio,
      r: (Math.random() * 1.6 + 0.6) * devicePixelRatio,
      life: 0,
      maxLife: 280 + Math.random() * 320,
      drift: Math.random() * Math.PI * 2
    };
  }
  function initEmbers() {
    sizeCanvas(emberCanvas);
    const count = Math.floor((window.innerWidth * window.innerHeight) / 22000);
    embers = Array.from({ length: count }, () => {
      const e = spawnEmber();
      e.y = Math.random() * emberCanvas.height;
      e.life = Math.random() * e.maxLife;
      return e;
    });
  }
  function drawEmbers(t) {
    ectx.clearRect(0, 0, emberCanvas.width, emberCanvas.height);
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.life++;
      e.drift += 0.01;
      e.x += e.vx + Math.sin(e.drift) * 0.15 * devicePixelRatio;
      e.y += e.vy;
      if (e.life > e.maxLife || e.y < -20) { embers[i] = spawnEmber(); continue; }
      const fade = 1 - (e.life / e.maxLife);
      const alpha = Math.min(1, fade * 1.2) * 0.85;
      const grad = ectx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 4);
      grad.addColorStop(0, `rgba(255, 180, 120, ${alpha})`);
      grad.addColorStop(0.4, `rgba(255, 90, 50, ${alpha * 0.6})`);
      grad.addColorStop(1, `rgba(180, 40, 20, 0)`);
      ectx.fillStyle = grad;
      ectx.beginPath(); ectx.arc(e.x, e.y, e.r * 4, 0, Math.PI * 2); ectx.fill();
      ectx.fillStyle = `rgba(255, 220, 180, ${alpha})`;
      ectx.beginPath(); ectx.arc(e.x, e.y, e.r * 0.6, 0, Math.PI * 2); ectx.fill();
    }
  }

  function loop(t) { drawStars(t); drawEmbers(t); requestAnimationFrame(loop); }
  function init() { initStars(); initEmbers(); }
  init();
  requestAnimationFrame(loop);

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 150);
  });
})();
</script>
</body>
</html>
