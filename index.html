<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Hells Heaven</title>
<meta name="description" content="Hells Heaven" />
<style>
  :root {
    --ember: #c2453a;
    --ember-bright: #ff6a4d;
    --gold: #b58a4a;
    --parch: #d8c9a4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Cinzel', 'Trajan Pro', Georgia, serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  /* ---------- Background layers ---------- */
  .bg {
    position: fixed; inset: 0;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }
  .bg-desktop { background-image: url('bg-desktop.jpg'); }
  .bg-mobile  { background-image: url('bg-mobile.jpg'); display: none; }

  @media (max-aspect-ratio: 1/1) {
    .bg-desktop { display: none; }
    .bg-mobile  { display: block; }
  }

  /* Vignette */
  .vignette {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.55) 80%, rgba(0,0,0,.85) 100%);
    pointer-events: none;
    z-index: 1;
  }

  #stars  { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  #embers { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  /* ---------- Scene container ---------- */
  .scene {
    position: relative;
    width: 100%; height: 100%;
    z-index: 4;
    perspective: 1400px;
    perspective-origin: 50% 50%;
    overflow: hidden;
  }

  /* ---------- Logo cluster (positioned absolutely, transitions via transform/size) ---------- */
  .logo-cluster {
    position: absolute;
    top: 50%; left: 50%;
    width: min(72vmin, 760px);
    height: min(72vmin, 760px);
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    transition: transform 1.1s cubic-bezier(.2,.8,.2,1),
                width     1.1s cubic-bezier(.2,.8,.2,1),
                height    1.1s cubic-bezier(.2,.8,.2,1),
                top       1.1s cubic-bezier(.2,.8,.2,1),
                left      1.1s cubic-bezier(.2,.8,.2,1);
  }
  body.view-lore .logo-cluster {
    width: min(46vmin, 460px);
    height: min(46vmin, 460px);
    top: 50%;
    left: 19vw;
    transform: translate(-50%, -50%);
  }

  .ring {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.55;
    mix-blend-mode: screen;
  }
  .ring svg { width: 100%; height: 100%; display: block; }
  .ring-outer { animation: spin 90s linear infinite; }
  .ring-mid   { animation: spin 60s linear infinite reverse; width: 78%; height: 78%; opacity: .4; }
  .ring-inner { animation: spin 40s linear infinite; width: 56%; height: 56%; opacity: .35; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-wrap {
    position: relative;
    width: 84%; height: 84%;
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1);
  }

  .logo-glow {
    position: absolute;
    inset: -8%;
    background: radial-gradient(circle at center, rgba(194,69,58,.55) 0%, rgba(194,69,58,.18) 35%, transparent 65%);
    filter: blur(40px);
    animation: pulse 4.5s ease-in-out infinite;
    transform: translateZ(-60px);
    pointer-events: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: .55; transform: translateZ(-60px) scale(1); }
    50%      { opacity: .85; transform: translateZ(-60px) scale(1.08); }
  }

  .logo {
    position: relative;
    width: 100%; height: 100%;
    background: url('logo-clean.png') center / contain no-repeat;
    filter:
      drop-shadow(0 18px 28px rgba(0,0,0,.85))
      drop-shadow(0 0 28px rgba(194,69,58,.45))
      drop-shadow(0 0 60px rgba(194,69,58,.25));
    transform: translateZ(40px);
    animation: float 6.5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateZ(40px) translateY(0); }
    50%      { transform: translateZ(50px) translateY(-8px); }
  }

  /* ---------- Lore button (on landing) ---------- */
  .lore-btn {
    position: fixed;
    bottom: 6.5vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    padding: 14px 38px;
    background: linear-gradient(180deg, rgba(40,8,8,.55) 0%, rgba(20,4,4,.65) 100%);
    color: var(--parch);
    border: 1px solid rgba(194,69,58,.55);
    border-radius: 999px;
    font-family: inherit;
    font-size: clamp(12px, 1.6vmin, 16px);
    letter-spacing: .45em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 20px rgba(194,69,58,.25), inset 0 0 12px rgba(0,0,0,.55);
    transition: all .35s ease;
    text-decoration: none;
  }
  .lore-btn:hover {
    color: #fff;
    border-color: rgba(255,140,90,.9);
    box-shadow: 0 0 32px rgba(255,106,77,.55), inset 0 0 16px rgba(0,0,0,.65);
    transform: translateX(-50%) translateY(-2px);
  }

  /* ---------- Back button (on lore) ---------- */
  .back-btn {
    position: fixed;
    top: 22px; left: 22px;
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: rgba(20,6,6,.55);
    color: var(--parch);
    border: 1px solid rgba(194,69,58,.45);
    border-radius: 999px;
    font-family: inherit;
    font-size: clamp(10px, 1.3vmin, 13px);
    letter-spacing: .35em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all .25s ease;
    text-decoration: none;
  }
  .back-btn:hover {
    color: #fff;
    border-color: rgba(255,140,90,.85);
    box-shadow: 0 0 22px rgba(255,106,77,.45);
  }
  .back-btn svg { width: 14px; height: 14px; }

  /* ---------- Landing-only / Lore-only visibility ---------- */
  .landing-only { transition: opacity .8s ease; }
  .lore-only    { transition: opacity .8s ease; }
  body.view-landing .lore-only    { opacity: 0; pointer-events: none; }
  body.view-lore    .landing-only { opacity: 0; pointer-events: none; }

  /* ---------- Timeline ---------- */
  .timeline-wrap {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    left: 38vw;
    max-width: 760px;
    padding: 7vh 4vmin 6vh 4vmin;
    display: flex; flex-direction: column;
    transition: opacity .8s ease;
  }
  .timeline-title {
    text-align: center;
    font-size: clamp(14px, 1.9vmin, 20px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: rgba(216,201,164,.75);
    margin-bottom: 2.2em;
    padding-left: .55em;
    text-shadow: 0 0 16px rgba(194,69,58,.45);
  }

  .timeline {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    padding: 1em 24px 4em 56px;
    scrollbar-width: thin;
    scrollbar-color: rgba(194,69,58,.55) transparent;
    mask-image: linear-gradient(180deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
  }
  .timeline::-webkit-scrollbar { width: 6px; }
  .timeline::-webkit-scrollbar-track { background: transparent; }
  .timeline::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(194,69,58,.55), rgba(120,20,12,.6));
    border-radius: 6px;
  }

  /* Vertical line */
  .timeline::before {
    content: "";
    position: absolute;
    left: 30px;
    top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(180deg,
      transparent 0%,
      rgba(194,69,58,.35) 8%,
      rgba(194,69,58,.7) 50%,
      rgba(194,69,58,.35) 92%,
      transparent 100%);
    box-shadow: 0 0 10px rgba(194,69,58,.55);
  }

  .ev {
    position: relative;
    padding: 14px 22px 14px 38px;
    margin-bottom: 14px;
    border: 1px solid rgba(194,69,58,.22);
    background: linear-gradient(135deg, rgba(20,4,4,.45), rgba(40,10,10,.25));
    border-radius: 10px;
    cursor: pointer;
    transition: transform .35s cubic-bezier(.2,.8,.2,1),
                border-color .35s ease,
                background .35s ease,
                box-shadow .35s ease;
    backdrop-filter: blur(2px);
  }
  .ev::before {
    /* Bullet on the line */
    content: "";
    position: absolute;
    left: -32px; top: 50%;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8a5a, #6a1a10 70%);
    box-shadow: 0 0 12px rgba(255,106,77,.85), 0 0 22px rgba(194,69,58,.4);
    transform: translateY(-50%);
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .ev::after {
    /* Connector line from bullet to card */
    content: "";
    position: absolute;
    left: -18px; top: 50%;
    width: 22px;
    height: 1px;
    background: linear-gradient(90deg, rgba(194,69,58,.55), transparent);
    transform: translateY(-50%);
  }

  .ev:hover {
    transform: translateX(6px);
    border-color: rgba(255,140,90,.7);
    background: linear-gradient(135deg, rgba(50,12,12,.6), rgba(80,20,12,.35));
    box-shadow: 0 0 26px rgba(194,69,58,.35);
  }
  .ev:hover::before {
    transform: translateY(-50%) scale(1.25);
    box-shadow: 0 0 18px rgba(255,150,100,1), 0 0 32px rgba(255,106,77,.6);
  }

  .ev .ev-name {
    font-size: clamp(13px, 1.7vmin, 17px);
    color: #f3e7d0;
    letter-spacing: .08em;
    line-height: 1.35;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .ev .ev-time {
    margin-top: 6px;
    font-size: clamp(10px, 1.25vmin, 12px);
    color: rgba(216,201,164,.6);
    letter-spacing: .3em;
    text-transform: uppercase;
    font-family: Georgia, serif;
    font-style: italic;
  }

  /* ---------- Enter overlay (click to enter) ---------- */
  .enter {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,.92) 100%);
    backdrop-filter: blur(2px);
    z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 1.6s ease-out;
    color: rgba(255, 220, 200, .85);
    font-family: inherit;
    letter-spacing: .35em;
    text-transform: uppercase;
    user-select: none;
  }
  .enter.hidden { opacity: 0; pointer-events: none; }
  .enter .enter-title {
    font-size: clamp(14px, 2.2vmin, 22px);
    text-shadow: 0 0 18px rgba(194,69,58,.55), 0 2px 6px rgba(0,0,0,.9);
    animation: enterPulse 2.6s ease-in-out infinite;
    padding: .4em 0;
  }
  .enter .enter-sub {
    font-size: clamp(10px, 1.4vmin, 14px);
    margin-top: 1.4em;
    opacity: .55;
    letter-spacing: .5em;
  }
  @keyframes enterPulse {
    0%, 100% { opacity: .65; }
    50%      { opacity: 1;   }
  }

  /* ---------- Mute toggle ---------- */
  .mute-btn {
    position: fixed;
    bottom: 22px; right: 22px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(20, 6, 6, .55);
    border: 1px solid rgba(194, 69, 58, .55);
    color: rgba(255, 210, 180, .9);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 90;
    transition: background .25s, transform .25s, box-shadow .25s;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 18px rgba(194,69,58,.25);
  }
  .mute-btn:hover {
    background: rgba(40, 10, 10, .8);
    transform: scale(1.08);
    box-shadow: 0 0 26px rgba(194,69,58,.6);
  }
  .mute-btn svg { width: 22px; height: 22px; }

  /* Mobile (portrait): stack — logo on top, timeline below */
  @media (max-aspect-ratio: 1/1) {
    body.view-lore .logo-cluster {
      width: min(38vmin, 320px);
      height: min(38vmin, 320px);
      top: 19vh;
      left: 50%;
    }
    .timeline-wrap {
      left: 0;
      top: 38vh;
      padding: 1vh 5vw 3vh;
      max-width: 100%;
    }
    .timeline-title { margin-bottom: .8em; }
    .timeline { padding-left: 44px; }
    .timeline::before { left: 22px; }
    .ev::before { left: -26px; }
    .ev::after  { left: -14px; width: 18px; }
    .back-btn { top: 14px; left: 14px; }
  }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    .ring-outer, .ring-mid, .ring-inner,
    .logo-glow, .logo { animation: none; }
  }
</style>
</head>
<body class="view-landing">
  <div class="bg bg-desktop"></div>
  <div class="bg bg-mobile"></div>
  <div class="vignette"></div>

  <canvas id="stars"></canvas>
  <canvas id="embers"></canvas>

  <div class="scene" id="scene">

    <!-- Logo cluster (rune rings + 3D logo). Moves to left column in lore view. -->
    <div class="logo-cluster" id="logoCluster">
      <div class="ring ring-outer" aria-hidden="true">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="ringFade" cx="50%" cy="50%" r="50%">
              <stop offset="70%" stop-color="rgba(194,69,58,0)"/>
              <stop offset="92%" stop-color="rgba(255,106,77,0.65)"/>
              <stop offset="100%" stop-color="rgba(194,69,58,0)"/>
            </radialGradient>
          </defs>
          <circle cx="200" cy="200" r="195" fill="none" stroke="url(#ringFade)" stroke-width="1.2"/>
          <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(181,138,74,.45)" stroke-width=".6" stroke-dasharray="2 6"/>
          <g stroke="rgba(255,160,120,.55)" stroke-width="1" fill="none">
            <g id="mark">
              <path d="M200 8 L196 22 L200 18 L204 22 Z" fill="rgba(255,160,120,.5)"/>
            </g>
            <use href="#mark" transform="rotate(45 200 200)"/>
            <use href="#mark" transform="rotate(90 200 200)"/>
            <use href="#mark" transform="rotate(135 200 200)"/>
            <use href="#mark" transform="rotate(180 200 200)"/>
            <use href="#mark" transform="rotate(225 200 200)"/>
            <use href="#mark" transform="rotate(270 200 200)"/>
            <use href="#mark" transform="rotate(315 200 200)"/>
          </g>
        </svg>
      </div>
      <div class="ring ring-mid" aria-hidden="true">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <circle cx="200" cy="200" r="195" fill="none" stroke="rgba(181,138,74,.5)" stroke-width=".8"/>
          <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(194,69,58,.35)" stroke-width=".5" stroke-dasharray="1 4"/>
        </svg>
      </div>
      <div class="ring ring-inner" aria-hidden="true">
        <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <circle cx="200" cy="200" r="195" fill="none" stroke="rgba(255,106,77,.4)" stroke-width=".6" stroke-dasharray="6 10"/>
        </svg>
      </div>

      <div class="logo-wrap" id="logoWrap">
        <div class="logo-glow"></div>
        <div class="logo"></div>
      </div>
    </div>

    <!-- Timeline (lore view) -->
    <div class="timeline-wrap lore-only" aria-hidden="true">
      <div class="timeline-title">Chronicle of Hells Heaven</div>
      <div class="timeline" id="timeline"></div>
    </div>
  </div>

  <!-- Landing-only: Lore button -->
  <a href="#lore" class="lore-btn landing-only" id="loreBtn">Lore</a>

  <!-- Lore-only: Back button -->
  <a href="#" class="back-btn lore-only" id="backBtn" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Back
  </a>

  <!-- Enter overlay (first visit only) -->
  <div class="enter" id="enter">
    <div class="enter-title">Click to enter</div>
    <div class="enter-sub">Hells Heaven</div>
  </div>

  <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

  <button class="mute-btn" id="muteBtn" aria-label="Mute" title="Mute" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
  </button>

<script>
(() => {
  // ---------- Timeline data ----------
  const EVENTS = [
    ["HH7 — The Ragnarok",                              "Undocumented"],
    ["HH8 — The Ancient War of Remnants",               "Undocumented"],
    ["HH9 — The Age of Lostborns",                      "Year 0 — Year 1000"],
    ["HH10 — The Cold War",                             "Year 1007 — Year 1030"],
    ["HH11 — The Rise of Pandaemonium",                 "Year 1030 — 1999"],
    ["HH12 — The Resurgence of the Golden Bloodline",   "1050 — 1080"],
    ["HH1 — The First War of Hell and Heaven",          "Year 2000"],
    ["HH2 — The Solaria Rebellion",                     "Year 2010 — 2020"],
    ["HH3 — The Second War of Hell and Heaven",         "Year 2024 — 2029"],
    ["HH4 — The Invasion of Middle Earth",              "Year 2030"],
    ["HH5 — The Tartarus Prison Break",                 "Year 2031"],
    ["HH6 — Hell's Civil War",                          "Year 2032"],
    ["HH13 — The Battle of the Chosens",                "Year 2050 — 2055"],
    ["HH14 — The Morning Star",                         "2082 — 2096"],
    ["HH15 — The Last War of Hell and Heaven",          "Year 3000"],
    ["HH16 — The Glorious Purpose (Part 1)",            "After year 3000"],
    ["HH17 — The Glorious Purpose (Part 2)",            "After year 3000"],
    ["HH18 — The Glorious Purpose (Part 3)",            "After year 3000"],
    ["The Final Chapter of Hells Heaven: The Dawn of the New Sun", ""],
  ];

  const timelineEl = document.getElementById('timeline');
  EVENTS.forEach(([name, time]) => {
    const div = document.createElement('div');
    div.className = 'ev';
    div.innerHTML =
      `<div class="ev-name">${name}</div>` +
      (time ? `<div class="ev-time">${time}</div>` : '');
    timelineEl.appendChild(div);
  });

  // ---------- View routing (hash) ----------
  function applyView() {
    const hash = window.location.hash.replace('#', '').toLowerCase();
    const isLore = hash === 'lore';
    document.body.classList.toggle('view-lore',    isLore);
    document.body.classList.toggle('view-landing', !isLore);
    // a11y
    document.querySelectorAll('.lore-only').forEach(el => el.setAttribute('aria-hidden', isLore ? 'false' : 'true'));
    document.querySelectorAll('.landing-only').forEach(el => el.setAttribute('aria-hidden', isLore ? 'true'  : 'false'));
  }
  window.addEventListener('hashchange', applyView);
  applyView();

  // ---------- Click-to-enter + audio ----------
  const enterEl = document.getElementById('enter');
  const bgm     = document.getElementById('bgm');
  const muteBtn = document.getElementById('muteBtn');

  const ICON_ON = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>`;
  const ICON_OFF = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>`;
  function updateMuteIcon() {
    muteBtn.innerHTML = bgm.muted ? ICON_OFF : ICON_ON;
    muteBtn.setAttribute('aria-label', bgm.muted ? 'Unmute' : 'Mute');
    muteBtn.setAttribute('title',     bgm.muted ? 'Unmute' : 'Mute');
  }

  function enterScene() {
    if (enterEl.classList.contains('hidden')) return;
    enterEl.classList.add('hidden');
    setTimeout(() => enterEl.remove(), 1800);
    bgm.volume = 0.6;
    bgm.play().catch(() => { /* mute button still works */ });
    muteBtn.style.display = 'flex';
    updateMuteIcon();
  }
  enterEl.addEventListener('click', enterScene);
  window.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') enterScene();
  });
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    bgm.muted = !bgm.muted;
    if (!bgm.muted && bgm.paused) bgm.play().catch(()=>{});
    updateMuteIcon();
  });

  // ---------- 3D parallax tilt on logo ----------
  const wrap = document.getElementById('logoWrap');
  const bgs = document.querySelectorAll('.bg');

  let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;
  let targetBX = 0, targetBY = 0, curBX = 0, curBY = 0;

  function onMove(x, y) {
    const w = window.innerWidth, h = window.innerHeight;
    const nx = (x / w) * 2 - 1;
    const ny = (y / h) * 2 - 1;
    targetRY =  nx * 14;
    targetRX = -ny * 10;
    targetBX = -nx * 18;
    targetBY = -ny * 14;
  }
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null || e.beta == null) return;
    const gx = Math.max(-30, Math.min(30, e.gamma)) / 30;
    const gy = Math.max(-30, Math.min(30, e.beta - 45)) / 30;
    targetRY =  gx * 14;
    targetRX = -gy * 10;
    targetBX = -gx * 18;
    targetBY = -gy * 14;
  });

  function animateTilt() {
    curRX += (targetRX - curRX) * 0.08;
    curRY += (targetRY - curRY) * 0.08;
    curBX += (targetBX - curBX) * 0.06;
    curBY += (targetBY - curBY) * 0.06;
    wrap.style.transform = `rotateX(${curRX.toFixed(2)}deg) rotateY(${curRY.toFixed(2)}deg)`;
    bgs.forEach(b => {
      b.style.transform = `translate3d(${curBX.toFixed(1)}px, ${curBY.toFixed(1)}px, 0) scale(1.05)`;
    });
    requestAnimationFrame(animateTilt);
  }
  requestAnimationFrame(animateTilt);

  // ---------- Starfield ----------
  const starCanvas = document.getElementById('stars');
  const sctx = starCanvas.getContext('2d');
  let stars = [];
  function sizeCanvas(c) {
    c.width = window.innerWidth * devicePixelRatio;
    c.height = window.innerHeight * devicePixelRatio;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
  }
  function initStars() {
    sizeCanvas(starCanvas);
    const count = Math.floor((window.innerWidth * window.innerHeight) / 9000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * starCanvas.width,
      y: Math.random() * starCanvas.height,
      r: Math.random() * 1.2 * devicePixelRatio + 0.2,
      a: Math.random() * 0.6 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.8,
      tint: Math.random() < 0.15
    }));
  }
  function drawStars(t) {
    sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
    for (const s of stars) {
      const tw = (Math.sin(t * 0.001 * s.speed + s.phase) + 1) / 2;
      const alpha = s.a * (0.4 + tw * 0.6);
      sctx.beginPath();
      sctx.fillStyle = s.tint
        ? `rgba(255, 140, 110, ${alpha})`
        : `rgba(255, 230, 210, ${alpha})`;
      sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      sctx.fill();
    }
  }

  // ---------- Embers ----------
  const emberCanvas = document.getElementById('embers');
  const ectx = emberCanvas.getContext('2d');
  let embers = [];
  function spawnEmber() {
    return {
      x: Math.random() * emberCanvas.width,
      y: emberCanvas.height + Math.random() * 50,
      vx: (Math.random() - 0.5) * 0.3 * devicePixelRatio,
      vy: -(0.3 + Math.random() * 0.7) * devicePixelRatio,
      r: (Math.random() * 1.6 + 0.6) * devicePixelRatio,
      life: 0,
      maxLife: 280 + Math.random() * 320,
      drift: Math.random() * Math.PI * 2
    };
  }
  function initEmbers() {
    sizeCanvas(emberCanvas);
    const count = Math.floor((window.innerWidth * window.innerHeight) / 22000);
    embers = Array.from({ length: count }, () => {
      const e = spawnEmber();
      e.y = Math.random() * emberCanvas.height;
      e.life = Math.random() * e.maxLife;
      return e;
    });
  }
  function drawEmbers(t) {
    ectx.clearRect(0, 0, emberCanvas.width, emberCanvas.height);
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.life++;
      e.drift += 0.01;
      e.x += e.vx + Math.sin(e.drift) * 0.15 * devicePixelRatio;
      e.y += e.vy;
      if (e.life > e.maxLife || e.y < -20) { embers[i] = spawnEmber(); continue; }
      const fade = 1 - (e.life / e.maxLife);
      const alpha = Math.min(1, fade * 1.2) * 0.85;
      const grad = ectx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 4);
      grad.addColorStop(0, `rgba(255, 180, 120, ${alpha})`);
      grad.addColorStop(0.4, `rgba(255, 90, 50, ${alpha * 0.6})`);
      grad.addColorStop(1, `rgba(180, 40, 20, 0)`);
      ectx.fillStyle = grad;
      ectx.beginPath(); ectx.arc(e.x, e.y, e.r * 4, 0, Math.PI * 2); ectx.fill();
      ectx.fillStyle = `rgba(255, 220, 180, ${alpha})`;
      ectx.beginPath(); ectx.arc(e.x, e.y, e.r * 0.6, 0, Math.PI * 2); ectx.fill();
    }
  }

  function loop(t) { drawStars(t); drawEmbers(t); requestAnimationFrame(loop); }
  function init() { initStars(); initEmbers(); }
  init();
  requestAnimationFrame(loop);

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 150);
  });
})();
</script>
</body>
</html>
