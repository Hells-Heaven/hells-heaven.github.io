  // HH4's roster was never posted, so the chapter carries no faction to read a side
  // from. Its own lore closes with Hell standing over a broken Middle Earth, so the
  // chapter is attributed here by hand. Everything else derives from the rosters.
  const SIDE_WON_MANUAL = { HH4: 'Devils' };

  function buildHOFStats() {
    const players = {};
    const pGet = t => players[t] || (players[t] = {
      apps: 0, wins: 0, losses: 0, ongoing: 0,
      mvp1: 0, mvp2: 0, mvp3: 0, mvpTotal: 0,
      mvpInLoss: [],
      mvpPlaces: [],              // {hh, rank}
      lmvpPlaces: [],             // {hh, place} — worst-player lists
      roles: [],                  // {hh, role, headline, faction, outcome}
      hhs: new Set(),
      factionsPlayed: [],
      headlineCount: 0,
      history: [],
    });
    HH_ORDER.forEach(k => {
      const rec = HH_DATA[k];
      if (!rec) return;
      const label = k.toUpperCase();
      if (rec.factions && rec.factions.length) {
        rec.factions.forEach(f => {
          f.members.forEach(m => {
            // A member may win or lose independently of their faction — an Angel who
            // escapes Hell in HH6, the lone Serpent left standing in HH7.
            const won = m.won !== undefined ? m.won : !!f.winner;
            const outcome = won ? 'won' : 'lost';
            const t = aliasOf(m.tag);
            const p = pGet(t);
            p.apps++;
            p.hhs.add(label);
            if (!f.noAlignment) p.factionsPlayed.push(f.name);
            p.roles.push({ hh: label, role: m.role, headline: !!m.headline, faction: f.name, outcome });
            if (m.headline) p.headlineCount++;
            if (outcome === 'won') p.wins++; else p.losses++;
            p.history.push({ hh: label, outcome });
          });
        });
        if (rec.mvps) {
          rec.mvps.forEach(mv => {
            const t = aliasOf(mv.tag);
            if (!players[t]) return;
            const p = players[t];
            p.mvpTotal++;
            p.mvpPlaces.push({ hh: label, rank: mv.rank });
            if (mv.rank === 1) p.mvp1++;
            else if (mv.rank === 2) p.mvp2++;
            else if (mv.rank === 3) p.mvp3++;
            const r = p.roles.find(rr => rr.hh === label);
            if (r && r.outcome === 'lost') p.mvpInLoss.push(label);
          });
        }
      } else if (rec.resultsOnly && rec.resultsOnly.length) {
        // A chapter with a known result but no surviving roster. It counts toward a
        // player's record and sits in its true place in the timeline, so streaks and
        // consecutive runs read correctly — but it carries no role, faction or pairing.
        rec.resultsOnly.forEach(r => {
          const p = pGet(aliasOf(r.tag));
          const outcome = r.won ? 'won' : 'lost';
          p.apps++;
          p.hhs.add(label);
          p.roles.push({ hh: label, role: null, headline: false, faction: null, outcome });
          if (r.won) p.wins++; else p.losses++;
          p.history.push({ hh: label, outcome });
          if (r.mvp) {
            p.mvpTotal++;
            p.mvpPlaces.push({ hh: label, rank: r.mvp });
            if (r.mvp === 1) p.mvp1++;
            else if (r.mvp === 2) p.mvp2++;
            else if (r.mvp === 3) p.mvp3++;
            if (outcome === 'lost') p.mvpInLoss.push(label);
          }
          if (r.lmvp) p.lmvpPlaces.push({ hh: label, place: r.lmvp });
        });
      } else if (rec.participants && rec.participants.length) {
        rec.participants.forEach(tag => {
          const t = aliasOf(tag);
          const p = pGet(t);
          p.apps++;
          p.hhs.add(label);
          p.ongoing++;
          p.history.push({ hh: label, outcome: 'ongoing' });
        });
      }
    });
    EXTRA_RESULTS.forEach(e => {
      const p = pGet(aliasOf(e.tag));
      p.apps++;
      p.hhs.add(e.hh);
      if (e.won) p.wins++; else p.losses++;
    });
    // Derived per-player
    Object.values(players).forEach(p => {
      p.completed = p.wins + p.losses;
      p.winRate = p.completed > 0 ? p.wins / p.completed : null;
      p.distinctRoles = new Set(p.roles.map(r => r.role).filter(r => r && r !== 'TBD'));
    });
    return players;
  }

  function topN(arr, n, keyFn) {
    return [...arr].sort((a, b) => keyFn(b) - keyFn(a)).slice(0, n);
  }

  function consecutive(p) {
    const idx = { HH1:0, HH2:1, HH3:2, HH4:3, HH5:4, HHX:5, HH6:6, HH7:7, HH8:8 };
    const ix = [...new Set(p.roles.map(r => idx[r.hh]).filter(v => v !== undefined))].sort((a,b)=>a-b);
    if (!ix.length) return 0;
    let best = 1, cur = 1;
    for (let i = 1; i < ix.length; i++) {
      cur = ix[i] === ix[i-1] + 1 ? cur + 1 : 1;
      if (cur > best) best = cur;
    }
    return best;
  }

  function streakOf(p, target) {
    let best = 0, cur = 0;
    p.history.forEach(h => {
      if (h.outcome === target) { cur++; if (cur > best) best = cur; }
      else cur = 0;
    });
    return best;
  }

  function pairStats() {
    const teamCount = {}, teamWins = {}, oppCount = {};
    const pairKey = (a, b) => [a, b].sort().join(' & ');
    HH_ORDER.forEach(k => {
      const rec = HH_DATA[k];
      if (!rec || !rec.factions || !rec.factions.length) return;
      rec.factions.forEach(f => {
        const tags = [...new Set(f.members.map(m => aliasOf(m.tag)))].sort();
        for (let i = 0; i < tags.length; i++) {
          for (let j = i+1; j < tags.length; j++) {
            const key = pairKey(tags[i], tags[j]);
            teamCount[key] = (teamCount[key]||0) + 1;
            if (f.winner) teamWins[key] = (teamWins[key]||0) + 1;
          }
        }
      });
      for (let a = 0; a < rec.factions.length; a++) {
        for (let b = a+1; b < rec.factions.length; b++) {
          const ta = rec.factions[a].members.map(m => aliasOf(m.tag));
          const tb = rec.factions[b].members.map(m => aliasOf(m.tag));
          ta.forEach(x => tb.forEach(y => {
            const key = pairKey(x, y);
            oppCount[key] = (oppCount[key]||0) + 1;
          }));
        }
      }
    });
    return { teamCount, teamWins, oppCount };
  }

  function fmtPct(rate) {
    return rate === null ? '—' : (rate * 100).toFixed(1) + '%';
  }

  function renderHOF() {
    const ps = buildHOFStats();
    const arr = Object.entries(ps).map(([tag, p]) => ({ tag, ...p }));

    // ---- Career ----
    const mostHH = topN(arr, 6, p => p.apps);
    const ironMan = topN(arr.map(p => ({ tag: p.tag, n: consecutive(p) })).filter(x => x.n > 0), 6, p => p.n);
    const og = arr.filter(p => p.roles.some(r => r.hh === 'HH1')).map(p => p.tag).sort();
    const stillActive = arr.filter(p => {
      const hs = new Set(p.roles.map(r => r.hh));
      return hs.has('HH1') && (hs.has('HH6') || hs.has('HH7') || hs.has('HH8'));
    }).map(p => p.tag).sort();
    const oneShot = arr.filter(p => p.apps === 1).map(p => p.tag).sort();

    // ---- Wins ----
    const qualified = arr.filter(p => p.completed >= 2);
    const winRate = topN(qualified, 8, p => p.winRate);
    const mostWins = topN(arr, 6, p => p.wins);
    const undefeated = qualified.filter(p => p.losses === 0).sort((a,b) => b.wins - a.wins);
    const mostLosses = topN(arr, 6, p => p.losses);
    const longestLoss = topN(arr.map(p => ({ tag: p.tag, n: streakOf(p, 'lost') })).filter(x => x.n > 1), 6, p => p.n);

    // ---- MVP ----
    const mvpList = topN(arr.filter(p => p.mvpTotal > 0), 8, p => p.mvpTotal);
    const mvp1 = topN(arr.filter(p => p.mvp1 > 0), 6, p => p.mvp1);
    const mvpRate = topN(arr.filter(p => p.apps >= 2 && p.mvpTotal > 0), 6, p => p.mvpTotal / p.apps);
    const heroic = arr.filter(p => p.mvpInLoss.length > 0);

    // A player named on a worst-player list who was later named among the best.
    const ORD = { HH1:0, HH2:1, HH3:2, HH4:3, HH5:4, HHX:5, HH6:6, HH7:7, HH8:8 };
    const comeback = arr.filter(p => p.lmvpPlaces.length).map(p => {
      const low = p.lmvpPlaces.reduce((a, b) => ORD[a.hh] <= ORD[b.hh] ? a : b);
      const rise = p.mvpPlaces
        .filter(m => ORD[m.hh] > ORD[low.hh])
        .sort((a, b) => a.rank - b.rank || ORD[a.hh] - ORD[b.hh])[0];
      return rise ? { tag: p.tag, low, rise, gap: ORD[rise.hh] - ORD[low.hh] } : null;
    }).filter(Boolean).sort((a, b) => a.rise.rank - b.rise.rank || a.gap - b.gap);

    // ---- Roles ----
    const distinct = topN(arr, 6, p => p.distinctRoles.size);
    const headliners = topN(arr, 6, p => p.headlineCount);
    function lineage(roleMatch) {
      const out = [];
      HH_ORDER.forEach(k => {
        const rec = HH_DATA[k]; if (!rec || !rec.factions) return;
        rec.factions.forEach(f => f.members.forEach(m => {
          // secondRole covers inherited titles — HH2's Servant passed to Drahsin on Deva's death.
          if (roleMatch(m.role) || (m.secondRole && roleMatch(m.secondRole))) {
            out.push({ hh: k.toUpperCase(), tag: aliasOf(m.tag) });
          }
        }));
      });
      return out;
    }
    const demonKings = lineage(r => /demon king/i.test(r));
    // The Serpent of Helios is the same office under its oldest name — HH7 is the
    // chapter the title comes from, not a separate one.
    const servants = lineage(r => /^the servant$|^servant$/i.test(r) || /^the serpent$/i.test(r));
    const chosenOnes = lineage(r => /chosen one/i.test(r));

    // The deception role is renamed every chapter but is always the same seat: the one
    // who reads as the other side. Lucifer mirrors the Spy in HH1, the Fallen Angel
    // mirrors the God of Mischief in HH3 and HHX, and the Frost Titan mirrors the
    // Fallen Angel in HH5.
    const isSpyRole = r => /^(the )?(spy|lucifer|fallen angel|god of mischief|frost titan)$/i.test(r || '');
    const spies = (() => {
      const m = {};
      arr.forEach(p => {
        const n = p.roles.filter(r => isSpyRole(r.role)).length;
        if (n > 0) m[p.tag] = n;
      });
      return Object.entries(m).sort((a,b) => b[1] - a[1]);
    })();

    // ---- Faction ----
    const DEVIL_ALIGNED = new Set(['Devils','Rebels','Fallen Gods']);
    const ANGEL_ALIGNED = new Set(['Angels','Royalists','Loyalists','Human & Valkyrie']);
    const trueDevil = arr.filter(p => {
      const factions = new Set(p.factionsPlayed.filter(f => f !== 'TBD'));
      return factions.size > 0 && [...factions].every(f => DEVIL_ALIGNED.has(f)) && p.factionsPlayed.length >= 2;
    }).map(p => p.tag);
    const trueAngel = arr.filter(p => {
      const factions = new Set(p.factionsPlayed.filter(f => f !== 'TBD'));
      return factions.size > 0 && [...factions].every(f => ANGEL_ALIGNED.has(f)) && p.factionsPlayed.length >= 2;
    }).map(p => p.tag);
    const devilSide = topN(arr.map(p => ({ tag: p.tag, n: p.factionsPlayed.filter(f => DEVIL_ALIGNED.has(f)).length })).filter(x => x.n > 0), 6, p => p.n);
    const angelSide = topN(arr.map(p => ({ tag: p.tag, n: p.factionsPlayed.filter(f => ANGEL_ALIGNED.has(f)).length })).filter(x => x.n > 0), 6, p => p.n);

    // ---- Pairs ----
    const ps2 = pairStats();
    const inseparable = Object.entries(ps2.teamCount).filter(([_, n]) => n >= 2).sort((a,b) => b[1] - a[1]).slice(0, 8);
    const strongest = Object.entries(ps2.teamWins).filter(([_, w]) => w >= 2).sort((a,b) => b[1] - a[1]).slice(0, 6);
    const rivalry = Object.entries(ps2.oppCount).filter(([_, n]) => n >= 2).sort((a,b) => b[1] - a[1]).slice(0, 8);

    // A rivalry is a pairing. This is not — it only has one direction, and it only
    // counts once the same hand has done it twice. If it ever happens again to
    // anybody, it will find itself.
    const ORD2 = { HH1:0, HH1v2:1, HH2:2, HH3:3, HH4:4, HH5:5, HHX:6, HH6:7, HH7:8, HH8:9 };
    const nemesis = Object.values(UNDOINGS.reduce((acc, u) => {
      const key = u.by + '␀' + u.of;
      (acc[key] || (acc[key] = { by: aliasOf(u.by), of: aliasOf(u.of), items: [] })).items.push(u);
      return acc;
    }, {}))
      .filter(g => g.items.length >= 2)
      .map(g => ({ ...g, items: g.items.slice().sort((a, b) => ORD2[a.hh] - ORD2[b.hh]) }))
      .sort((a, b) => b.items.length - a.items.length);

    // ---- Single-game ----
    // HH7 splits the gods into groups by what they can perceive, not by allegiance.
    // Those are not factions and do not belong in faction records.
    const isFaction = f => !f.noAlignment;
    const allFac = [];
    HH_ORDER.forEach(k => {
      const r = HH_DATA[k]; if (!r || !r.factions) return;
      r.factions.filter(isFaction).forEach(f => allFac.push({ hh: k.toUpperCase(), name: f.name, size: f.members.length, won: !!f.winner }));
    });
    const largest = [...allFac].sort((a,b) => b.size - a.size).slice(0, 3);
    // Lopsidedness is the winners' share of the whole chapter, not raw headcount — and
    // winners are counted per player, since a faction can lose while a member still wins.
    const winGroups = [];
    HH_ORDER.forEach(k => {
      const r = HH_DATA[k]; if (!r || !r.factions) return;
      const total = r.factions.reduce((n, f) => n + f.members.length, 0);
      r.factions.filter(isFaction).forEach(f => {
        const won = f.members.filter(m => (m.won !== undefined ? m.won : !!f.winner)).length;
        if (won) winGroups.push({ hh: k.toUpperCase(), name: f.name, size: won, total });
      });
    });
    const lopsided = winGroups.sort((a,b) => (a.size / a.total) - (b.size / b.total)).slice(0, 3);

    const swiftest = SWIFT_ENDS
      .map(e => ({ ...e, tag: aliasOf(e.tag) }))
      .sort((a, b) => a.day - b.day)
      .slice(0, 3);

    const multiDeaths = MULTI_DEATHS
      .map(e => ({ ...e, tag: aliasOf(e.tag) }))
      .sort((a, b) => b.deaths - a.deaths || ORD[a.hh] - ORD[b.hh])
      .slice(0, 5);

    // Counted in chapters finished, not years waited. history runs in chronicle order, so
    // the index of the first win is the number of chapters that ended without one.
    const longWait = arr
      .map(p => { const i = p.history.findIndex(h => h.outcome === 'won');
                  return i > 0 ? { tag: p.tag, n: i, hh: p.history[i].hh } : null; })
      .filter(Boolean)
      .sort((a, b) => b.n - a.n)
      .slice(0, 5);

    // The run a player is carrying right now, which is not the same as his worst ever.
    const stillWaiting = arr.map(p => {
      let n = 0;
      for (let i = p.history.length - 1; i >= 0; i--) { if (p.history[i].outcome === 'lost') n++; else break; }
      return n >= 2 ? { tag: p.tag, n } : null;
    }).filter(Boolean).sort((a, b) => b.n - a.n).slice(0, 6);

    // Span is first chapter to last with the silences counted in, which is a different
    // thing from how many a player actually turned up for.
    const SPAN = {}; HH_ORDER.forEach((k, i) => SPAN[k.toUpperCase()] = i);
    const careerSpan = arr.map(p => {
      const ix = p.roles.map(r => SPAN[r.hh]).filter(v => v !== undefined).sort((a, b) => a - b);
      return ix.length ? { tag: p.tag, n: ix[ix.length - 1] - ix[0] + 1,
                           from: HH_ORDER[ix[0]].toUpperCase(),
                           to: HH_ORDER[ix[ix.length - 1]].toUpperCase() } : null;
    }).filter(Boolean).sort((a, b) => b.n - a.n).slice(0, 5);

    const beside = (() => {
      const m = {};
      HH_ORDER.forEach(k => { const r = HH_DATA[k]; if (!r || !r.factions) return;
        r.factions.forEach(f => { const t = f.members.map(x => aliasOf(x.tag));
          t.forEach(a => t.forEach(b => { if (a !== b) (m[a] || (m[a] = new Set())).add(b); })); }); });
      return Object.entries(m).map(([tag, set]) => ({ tag, n: set.size }))
        .sort((a, b) => b.n - a.n).slice(0, 6);
    })();

    const debutMVP = arr.map(p => {
      if (!p.history.length) return null;
      const first = p.history[0].hh;
      const m = p.mvpPlaces.find(x => x.hh === first);
      return m ? { tag: p.tag, hh: first, rank: m.rank } : null;
    }).filter(Boolean).sort((a, b) => a.rank - b.rank || ORD[a.hh] - ORD[b.hh]);

    const neverBest = arr.filter(p => p.mvpTotal === 0).sort((a, b) => b.apps - a.apps).slice(0, 6);

    // Counted in chapters rather than factions, because a chapter can field two armies of
    // the same side — HH6 ran Loyalists against Rebels — and only one of them can win.
    // Helios is left out: it was decided by a Serpent, and the Serpent answers to neither.
    const sideWins = (() => {
      const decided = [];
      HH_ORDER.forEach(k => {
        const label = k.toUpperCase();
        if (SIDE_WON_MANUAL[label]) { decided.push({ hh: label, side: SIDE_WON_MANUAL[label] }); return; }
        const r = HH_DATA[k]; if (!r || !r.factions) return;
        const win = r.factions.find(f => f.winner && isFaction(f));
        if (!win) return;
        const side = DEVIL_ALIGNED.has(win.name) ? 'Devils'
                   : ANGEL_ALIGNED.has(win.name) ? 'Angels' : null;
        if (side) decided.push({ hh: label, side });
      });
      const tally = {};
      decided.forEach(d => (tally[d.side] = (tally[d.side] || 0) + 1));
      return Object.entries(tally)
        .map(([name, w]) => ({ name, w, n: decided.length,
                               chapters: decided.filter(d => d.side === name).map(d => d.hh) }))
        .sort((a, b) => b.w - a.w);
    })();

    // Every name the chronicle holds, newest-heaviest career first. Sorted again in the
    // browser whenever a column heading is clicked.
    const fullRecord = arr.slice()
      .sort((a, b) => b.apps - a.apps || b.wins - a.wins || a.tag.localeCompare(b.tag));

    // ---- Render ----
    const list = (rows, render) => rows.length ? rows.map(render).join('') : '<div class="hof-empty">—</div>';

    const html = `
      <div class="hof-entrance">
        <div class="hof-eyebrow">Records of the Chronicle</div>
        <h1 class="hof-title">Hall of Fame</h1>
        <div class="hof-flourish"></div>
        <p class="hof-lede">Names carved into the marble of the dark. Every clash, every wound, every breath of victory tallied beneath the same eternal sky.</p>
        <div class="hof-scroll">
          <span>Scroll Down</span>
          <svg viewBox="0 0 22 12" fill="none" aria-hidden="true"><path d="M2 2l9 8 9-8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <section class="hof-section">
        <h2 class="hof-section-title">Career &amp; Longevity</h2>
        <div class="hof-grid">
          <article class="hof-card">
            <h3>Most Chronicles Played</h3>
            <ol class="hof-rank">${list(mostHH, p => `<li><b>${p.tag}</b><span class="hof-val">${p.apps}</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Iron Man — Consecutive Chapters</h3>
            <ol class="hof-rank">${list(ironMan, p => `<li><b>${p.tag}</b><span class="hof-val">${p.n}</span></li>`)}</ol>
          </article>
          <article class="hof-card wide">
            <h3>The Originals — HH1 Roster</h3>
            <p class="hof-namestrip">${og.join(' · ')}</p>
          </article>
          <article class="hof-card">
            <h3>Still-Burning Veterans</h3>
            <p class="hof-desc">Played the first war <em>and</em> still fight in HH6+</p>
            <p class="hof-namestrip">${stillActive.join(' · ') || '—'}</p>
          </article>
          <article class="hof-card">
            <h3>One Appearance Only</h3>
            <p class="hof-namestrip muted">${oneShot.join(' · ')}</p>
          </article>
          <article class="hof-card">
            <h3>Longest Career Span</h3>
            <p class="hof-desc">First chapter to last, the silences counted in</p>
            <ol class="hof-rank">${list(careerSpan, x => `<li><b>${x.tag}</b> <span class="hof-hh">${x.from} → ${x.to}</span><span class="hof-val">${x.n}</span></li>`)}</ol>
          </article>
        </div>
      </section>

      <section class="hof-section">
        <h2 class="hof-section-title">Records of Victory</h2>
        <div class="hof-grid">
          <article class="hof-card">
            <h3>Highest Win Rate <span class="hof-cond">(2+ games)</span></h3>
            <ol class="hof-rank">${list(winRate, p => `<li><b>${p.tag}</b><span class="hof-val">${fmtPct(p.winRate)} <i>(${p.wins}/${p.completed})</i></span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Undefeated Club</h3>
            <p class="hof-desc">100% win rate, 2+ completed games</p>
            <ol class="hof-rank">${list(undefeated, p => `<li><b>${p.tag}</b><span class="hof-val">${p.wins}/${p.wins}</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Most Wins</h3>
            <ol class="hof-rank">${list(mostWins.filter(p => p.wins > 0), p => `<li><b>${p.tag}</b><span class="hof-val">${p.wins}</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Most Losses</h3>
            <ol class="hof-rank">${list(mostLosses.filter(p => p.losses > 0), p => `<li><b>${p.tag}</b><span class="hof-val">${p.losses}</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Longest Losing Streak</h3>
            <ol class="hof-rank">${list(longestLoss, p => `<li><b>${p.tag}</b><span class="hof-val">${p.n} in a row</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Still Waiting</h3>
            <p class="hof-desc">The run a player is carrying right now</p>
            <ol class="hof-rank">${list(stillWaiting, p => `<li><b>${p.tag}</b><span class="hof-val">${p.n} and counting</span></li>`)}</ol>
          </article>
        </div>
      </section>

      <section class="hof-section">
        <h2 class="hof-section-title">MVP Royalty</h2>
        <div class="hof-grid">
          <article class="hof-card">
            <h3>Most MVPs</h3>
            <ol class="hof-rank">${list(mvpList, p => `<li><b>${p.tag}</b><span class="hof-val">${p.mvpTotal} <i>(I:${p.mvp1} II:${p.mvp2} III:${p.mvp3})</i></span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Gilded Crown — Most #1 MVPs</h3>
            <ol class="hof-rank">${list(mvp1, p => `<li><b>${p.tag}</b><span class="hof-val">${p.mvp1}</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>MVP Rate <span class="hof-cond">(2+ apps)</span></h3>
            <ol class="hof-rank">${list(mvpRate, p => `<li><b>${p.tag}</b><span class="hof-val">${(p.mvpTotal / p.apps * 100).toFixed(0)}% <i>(${p.mvpTotal}/${p.apps})</i></span></li>`)}</ol>
          </article>
          <article class="hof-card wide">
            <h3>Heroic Losses</h3>
            <p class="hof-desc">MVPs whose faction still fell</p>
            <ul class="hof-rank">${list(heroic, p => `<li><b>${p.tag}</b><span class="hof-val">${p.mvpInLoss.join(', ')}</span></li>`)}</ul>
          </article>
          <article class="hof-card">
            <h3>Best on Debut</h3>
            <p class="hof-desc">Named among the best in their first chapter</p>
            <ol class="hof-rank">${list(debutMVP, d => `<li><b>${d.tag}</b> <span class="hof-hh">${d.hh}</span><span class="hof-val">#${d.rank}</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Never Named</h3>
            <p class="hof-desc">Most chapters played without once making a list</p>
            <ol class="hof-rank">${list(neverBest, p => `<li><b>${p.tag}</b><span class="hof-val">${p.apps}</span></li>`)}</ol>
          </article>
          <article class="hof-card wide">
            <h3>Best Comeback</h3>
            <p class="hof-desc">Named among the worst, then named among the best</p>
            <ul class="hof-rank">${list(comeback, c => `<li><b>${c.tag}</b><span class="hof-val">${c.low.hh} worst #${c.low.place} → ${c.rise.hh} MVP #${c.rise.rank}</span></li>`)}</ul>
          </article>
        </div>
        <p class="hof-quote">Vanetails is the only name in the chronicle crowned first twice, and she took both in a row. Three wars, three times named among the best, and then she never played again.</p>
      </section>

      <section class="hof-section">
        <h2 class="hof-section-title">Roles &amp; Lineages</h2>
        <div class="hof-grid">
          <article class="hof-card">
            <h3>Most Distinct Roles</h3>
            <ol class="hof-rank">${list(distinct.filter(p => p.distinctRoles.size > 1), p => `<li><b>${p.tag}</b><span class="hof-val">${p.distinctRoles.size}</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Marquee Role Carriers</h3>
            <p class="hof-desc">Times given a chapter's headline role</p>
            <ol class="hof-rank">${list(headliners.filter(p => p.headlineCount > 0), p => `<li><b>${p.tag}</b><span class="hof-val">${p.headlineCount}</span></li>`)}</ol>
          </article>
          <article class="hof-card wide">
            <h3>The Demon King Lineage</h3>
            <ul class="hof-lineage">${demonKings.map(x => `<li><span class="hof-hh">${x.hh}</span><span class="hof-name">${x.tag}</span></li>`).join('')}</ul>
          </article>
          <article class="hof-card wide">
            <h3>The Chosen One Lineage</h3>
            <ul class="hof-lineage">${chosenOnes.map(x => `<li><span class="hof-hh">${x.hh}</span><span class="hof-name">${x.tag}</span></li>`).join('')}</ul>
          </article>
          <article class="hof-card wide">
            <h3>The Servant Lineage</h3>
            <ul class="hof-lineage">${servants.map(x => `<li><span class="hof-hh">${x.hh}</span><span class="hof-name">${x.tag}</span></li>`).join('')}</ul>
          </article>
          <article class="hof-card">
            <h3>The Spies</h3>
            <p class="hof-desc">One seat, five names — Spy, Lucifer, Fallen Angel, God of Mischief, Frost Titan</p>
            <ol class="hof-rank">${list(spies, ([tag,n]) => `<li><b>${tag}</b><span class="hof-val">${n}</span></li>`)}</ol>
          </article>
        </div>
        <p class="hof-quote">Thekindone has been named among the best in four chapters and won only three of eight — no one in the chronicle has been praised so often for so little reward.</p>
      </section>

      <section class="hof-section">
        <h2 class="hof-section-title">Allegiance</h2>
        <div class="hof-grid">
          <article class="hof-card">
            <h3>True Devil — Never Walked the Other Side</h3>
            <p class="hof-namestrip">${trueDevil.length ? trueDevil.join(' · ') : '—'}</p>
          </article>
          <article class="hof-card">
            <h3>True Angel — Never Walked the Other Side</h3>
            <p class="hof-namestrip">${trueAngel.length ? trueAngel.join(' · ') : '—'}</p>
          </article>
          <article class="hof-card">
            <h3>Most Devils-side Chapters</h3>
            <ol class="hof-rank">${list(devilSide, p => `<li><b>${p.tag}</b><span class="hof-val">${p.n}</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Most Angels-side Chapters</h3>
            <ol class="hof-rank">${list(angelSide, p => `<li><b>${p.tag}</b><span class="hof-val">${p.n}</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Which Side Wins</h3>
            <p class="hof-desc">Chapters decided between the two sides. Rebels and the Fallen Gods count as Devils; Loyalists, Royalists and the Valkyries as Angels</p>
            <ol class="hof-rank">${list(sideWins, x => `<li><b>${x.name}</b><span class="hof-val">${x.w} of ${x.n}</span></li>`)}</ol>
            <p class="hof-under">${sideWins.map(x => `${x.name} — ${x.chapters.join(', ')}`).join('. ')}.</p>
          </article>
        </div>
      </section>

      <section class="hof-section">
        <h2 class="hof-section-title">Pair Dynamics</h2>
        <div class="hof-grid">
          <article class="hof-card wide">
            <h3>Inseparable — Most Often on the Same Team</h3>
            <ol class="hof-rank">${list(inseparable, ([pair, n]) => `<li><b>${pair}</b><span class="hof-val">${n}×</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Strongest Duo — Most Wins Together</h3>
            <ol class="hof-rank">${list(strongest, ([pair, w]) => `<li><b>${pair}</b><span class="hof-val">${w} wins</span></li>`)}</ol>
          </article>
          <article class="hof-card wide">
            <h3>Greatest Rivalries — Most Often Opposed</h3>
            <ol class="hof-rank">${list(rivalry, ([pair, n]) => `<li><b>${pair}</b><span class="hof-val">${n}×</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Most Names Fought Beside</h3>
            <p class="hof-desc">Different people who have shared a faction with them</p>
            <ol class="hof-rank">${list(beside, p => `<li><b>${p.tag}</b><span class="hof-val">${p.n}</span></li>`)}</ol>
          </article>
          ${nemesis.length ? `
          <article class="hof-card wide">
            <h3>Nemesis — Undone Twice by the Same Hand</h3>
            <p class="hof-desc">A rivalry runs both ways. This only runs one.</p>
            ${nemesis.map(g => `
            <p class="hof-nem">${g.by}<span>→</span>${g.of}</p>
            <ul class="hof-lineage">${g.items.map(i => `<li><span class="hof-hh">${i.hh}</span><span class="hof-name">${i.how}</span></li>`).join('')}</ul>`).join('')}
          </article>` : ''}
        </div>
      </section>

      <section class="hof-section">
        <h2 class="hof-section-title">Singular Records</h2>
        <div class="hof-grid">
          <article class="hof-card">
            <h3>Largest Faction in a Chapter</h3>
            <ol class="hof-rank">${list(largest, f => `<li><b>${f.name}</b> <span class="hof-hh">${f.hh}</span><span class="hof-val">${f.size}</span></li>`)}</ol>
          </article>
          <article class="hof-card">
            <h3>Most Lopsided Victory</h3>
            <p class="hof-desc">Smallest faction that walked away as winner</p>
            <ol class="hof-rank">${list(lopsided, f => `<li><b>${f.name}</b> <span class="hof-hh">${f.hh}</span><span class="hof-val">${f.size} of ${f.total}</span></li>`)}</ol>
          </article>
          ${swiftest.length ? `
          <article class="hof-card">
            <h3>Fastest Death</h3>
            <p class="hof-desc">Shortest anyone has lasted in a chapter</p>
            <ol class="hof-rank">${list(swiftest, e => `<li><b>${e.tag}</b> <span class="hof-hh">${e.hh}</span><span class="hof-val">Day ${e.day}</span></li>`)}</ol>
            <p class="hof-under">${swiftest[0].how}</p>
          </article>` : ''}
          ${multiDeaths.length ? `
          <article class="hof-card">
            <h3>Most Deaths in One Chapter</h3>
            <p class="hof-desc">Died, was brought back, and died again</p>
            <ol class="hof-rank">${list(multiDeaths, e => `<li><b>${e.tag}</b> <span class="hof-hh">${e.hh}</span><span class="hof-val">${e.deaths}</span></li>`)}</ol>
            ${multiDeaths[0].how ? `<p class="hof-under">${multiDeaths[0].how}</p>` : ''}
          </article>` : ''}
          <article class="hof-card">
            <h3>The Long Wait</h3>
            <p class="hof-desc">Chapters finished without a win before the first one came</p>
            <ol class="hof-rank">${list(longWait, w => `<li><b>${w.tag}</b> <span class="hof-hh">${w.hh}</span><span class="hof-val">${w.n}</span></li>`)}</ol>
          </article>
        </div>
        <p class="hof-quote">One Angel walked out of Hell alone, and not even his own side came with him. Ragnarok ended narrower still, but Helios had no armies — and a lone god cannot be measured against a faction that never existed.</p>
      </section>

      <section class="hof-section">
        <h2 class="hof-section-title">The Full Record</h2>
        <div class="hof-grid">
          <article class="hof-card wide plain">
            <p class="hof-desc">Every name the chronicle holds. Click a heading to sort by it.</p>
            <div class="hof-table-wrap">
              <table class="hof-table">
                <thead>
                  <tr>
                    <th></th>
                    <th data-key="name">Player<span class="sort-mark"></span></th>
                    <th data-key="played">Played<span class="sort-mark">▼</span></th>
                    <th data-key="won">Won<span class="sort-mark"></span></th>
                    <th data-key="lost">Lost<span class="sort-mark"></span></th>
                    <th data-key="rate">Win rate<span class="sort-mark"></span></th>
                  </tr>
                </thead>
                <tbody>
                  ${fullRecord.map((p, i) => `
                  <tr data-name="${p.tag}" data-played="${p.apps}" data-won="${p.wins}" data-lost="${p.losses}" data-rate="${p.winRate === null ? -1 : p.winRate}">
                    <td class="rank">${i + 1}</td>
                    <td class="name">${p.tag}</td>
                    <td>${p.apps}</td>
                    <td>${p.wins}</td>
                    <td>${p.losses}</td>
                    <td class="rate">${fmtPct(p.winRate)}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </article>
        </div>
      </section>

      <div class="hof-foot">⛧ Carved beneath the Eternal Sky ⛧</div>
    `;
    document.getElementById('hofContent').innerHTML = html;

    // Column sorting for the full record. Ties fall back to the career-weight order the
    // table is built in, so a click never scrambles names that are level on the key.
    const tbl = document.querySelector('.hof-table');
    if (tbl) {
      const tbody = tbl.querySelector('tbody');
      const heads = [...tbl.querySelectorAll('thead th[data-key]')];
      let key = 'played', dir = -1;
      heads.forEach(th => th.addEventListener('click', () => {
        const k = th.getAttribute('data-key');
        if (k === key) dir = -dir; else { key = k; dir = k === 'name' ? 1 : -1; }
        [...tbody.querySelectorAll('tr')]
          .sort((a, b) => {
            const va = a.dataset[key], vb = b.dataset[key];
            const cmp = key === 'name' ? va.localeCompare(vb) : Number(va) - Number(vb);
            return cmp * dir
              || Number(b.dataset.played) - Number(a.dataset.played)
              || Number(b.dataset.won) - Number(a.dataset.won)
              || a.dataset.name.localeCompare(b.dataset.name);
          })
          .forEach((row, i) => { row.querySelector('.rank').textContent = i + 1; tbody.appendChild(row); });
        heads.forEach(h => h.querySelector('.sort-mark').textContent =
          h === th ? (dir < 0 ? '▼' : '▲') : '');
      }));
    }

    startHofTunnel();
  }

  // ---------- Tunnel canvas ----------
  let hofTunnelRAF = null;
  function startHofTunnel() {
    const canvas = document.getElementById('hofTunnel');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w, h, cx, cy;
    const PARTICLES = 240;
    let particles = [];

    function resize() {
      w = canvas.width = window.innerWidth * devicePixelRatio;
      h = canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      cx = w / 2; cy = h / 2;
    }
    function spawn(p) {
      p.x = (Math.random() - 0.5) * w * 1.4;
      p.y = (Math.random() - 0.5) * h * 1.4;
      p.z = Math.random() * 1200 + 100;
      p.r = Math.random() * 1.8 + 0.6;
      p.hue = Math.random() < 0.3 ? 25 : (Math.random() < 0.5 ? 12 : 340);
    }
    function init() {
      particles = Array.from({ length: PARTICLES }, () => {
        const p = {};
        spawn(p);
        p.z = Math.random() * 1200;
        return p;
      });
    }
    resize();
    init();
    window.addEventListener('resize', resize);
    function frame() {
      ctx.fillStyle = 'rgba(8, 4, 6, 0.28)';
      ctx.fillRect(0, 0, w, h);
      const speed = 8;
      for (const p of particles) {
        p.z -= speed;
        if (p.z < 1) {
          spawn(p); p.z = 1200;
          continue;
        }
        const k = 320 / p.z;
        const px = p.x * k + cx;
        const py = p.y * k + cy;
        if (px < 0 || px > w || py < 0 || py > h) continue;
        const sz = Math.max(0.4, p.r * k * 1.4) * devicePixelRatio;
        const alpha = Math.min(1, (1300 - p.z) / 800);
        ctx.fillStyle = `hsla(${p.hue}, 80%, ${55 + 20 * (1 - p.z / 1200)}%, ${alpha})`;
        ctx.beginPath();
        ctx.arc(px, py, sz, 0, Math.PI * 2);
        ctx.fill();
        // streak tail
        const k2 = 320 / (p.z + speed * 4);
        const px2 = p.x * k2 + cx;
        const py2 = p.y * k2 + cy;
        ctx.strokeStyle = `hsla(${p.hue}, 80%, 60%, ${alpha * 0.35})`;
        ctx.lineWidth = sz * 0.5;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px2, py2);
        ctx.stroke();
      }
      hofTunnelRAF = requestAnimationFrame(frame);
    }
    if (hofTunnelRAF) cancelAnimationFrame(hofTunnelRAF);
    frame();
  }

  // ---------- View routing (hash) ----------
  function applyView() {
    const hash = window.location.hash.replace('#', '').toLowerCase();
    const isLore = hash === 'lore';
    const hhMatch = hash.match(/^hh([1-8])$/);
    const isHHX = hash === 'hhx';
    const isHOF = hash === 'hof';

    // Clear all view classes
    ['view-landing','view-lore','view-hh1','view-hh2','view-hh3','view-hh4','view-hh5','view-hh6','view-hh7','view-hh8','view-hhx','view-hof']
      .forEach(c => document.body.classList.remove(c));

    if (hhMatch) {
      const key = 'hh' + hhMatch[1];
      document.body.classList.add('view-' + key);
      renderDashboard(key);
      document.body.scrollTop = 0; window.scrollTo(0, 0);
    } else if (isHHX) {
      document.body.classList.add('view-hhx');
      renderDashboard('hhx');
      document.body.scrollTop = 0; window.scrollTo(0, 0);
    } else if (isHOF) {
      document.body.classList.add('view-hof');
      if (typeof renderHOF === 'function') renderHOF();
      document.body.scrollTop = 0; window.scrollTo(0, 0);
    } else if (isLore) {
      document.body.classList.add('view-lore');
      document.body.scrollTop = 0; window.scrollTo(0, 0);
    } else {
      document.body.classList.add('view-landing');
      document.body.scrollTop = 0; window.scrollTo(0, 0);
    }

    // a11y
    document.querySelectorAll('.lore-only').forEach(el => el.setAttribute('aria-hidden', isLore ? 'false' : 'true'));
    document.querySelectorAll('.landing-only').forEach(el => el.setAttribute('aria-hidden', (isLore || hhMatch || isHHX || isHOF) ? 'true' : 'false'));
    document.querySelectorAll('.dashboard-only').forEach(el => el.setAttribute('aria-hidden', (hhMatch || isHHX) ? 'false' : 'true'));
    document.querySelectorAll('.hof-only').forEach(el => el.setAttribute('aria-hidden', isHOF ? 'false' : 'true'));
  }
  window.addEventListener('hashchange', applyView);
  applyView();

  // ---------- Click-to-enter + audio ----------
  const enterEl = document.getElementById('enter');
  const bgm     = document.getElementById('bgm');
  const muteBtn = document.getElementById('muteBtn');

  const ICON_ON = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>`;
  const ICON_OFF = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>`;
  function updateMuteIcon() {
    muteBtn.innerHTML = bgm.muted ? ICON_OFF : ICON_ON;
    muteBtn.setAttribute('aria-label', bgm.muted ? 'Unmute' : 'Mute');
    muteBtn.setAttribute('title',     bgm.muted ? 'Unmute' : 'Mute');
  }

  function enterScene() {
    if (enterEl.classList.contains('hidden')) return;
    enterEl.classList.add('hidden');
    setTimeout(() => enterEl.remove(), 1800);
    bgm.volume = 0.6;
    bgm.play().catch(() => { /* mute button still works */ });
    muteBtn.style.display = 'flex';
    updateMuteIcon();
  }
  enterEl.addEventListener('click', enterScene);
  window.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') enterScene();
  });
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    bgm.muted = !bgm.muted;
    if (!bgm.muted && bgm.paused) bgm.play().catch(()=>{});
    updateMuteIcon();
  });

  // ---------- 3D parallax tilt on logo ----------
  const wrap = document.getElementById('logoWrap');
  const bgs = document.querySelectorAll('.bg');

  let targetRX = 0, targetRY = 0, curRX = 0, curRY = 0;
  let targetBX = 0, targetBY = 0, curBX = 0, curBY = 0;

  function onMove(x, y) {
    const w = window.innerWidth, h = window.innerHeight;
    const nx = (x / w) * 2 - 1;
    const ny = (y / h) * 2 - 1;
    targetRY =  nx * 14;
    targetRX = -ny * 10;
    targetBX = -nx * 18;
    targetBY = -ny * 14;
  }
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY), { passive: true });
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null || e.beta == null) return;
    const gx = Math.max(-30, Math.min(30, e.gamma)) / 30;
    const gy = Math.max(-30, Math.min(30, e.beta - 45)) / 30;
    targetRY =  gx * 14;
    targetRX = -gy * 10;
    targetBX = -gx * 18;
    targetBY = -gy * 14;
  });

  function animateTilt() {
    curRX += (targetRX - curRX) * 0.08;
    curRY += (targetRY - curRY) * 0.08;
    curBX += (targetBX - curBX) * 0.06;
    curBY += (targetBY - curBY) * 0.06;
    wrap.style.transform = `rotateX(${curRX.toFixed(2)}deg) rotateY(${curRY.toFixed(2)}deg)`;
    bgs.forEach(b => {
      b.style.transform = `translate3d(${curBX.toFixed(1)}px, ${curBY.toFixed(1)}px, 0) scale(1.05)`;
    });
    // Servant portrait tilt (slightly stronger than logo for prominence)
    document.querySelectorAll('.servant-frame').forEach(f => {
      f.style.transform = `rotateX(${(curRX * 1.2).toFixed(2)}deg) rotateY(${(curRY * 1.2).toFixed(2)}deg)`;
    });
    requestAnimationFrame(animateTilt);
  }
  requestAnimationFrame(animateTilt);

  // ---------- Starfield ----------
  const starCanvas = document.getElementById('stars');
  const sctx = starCanvas.getContext('2d');
  let stars = [];
  function sizeCanvas(c) {
    c.width = window.innerWidth * devicePixelRatio;
    c.height = window.innerHeight * devicePixelRatio;
    c.style.width = window.innerWidth + 'px';
    c.style.height = window.innerHeight + 'px';
  }
  function initStars() {
    sizeCanvas(starCanvas);
    const count = Math.floor((window.innerWidth * window.innerHeight) / 9000);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * starCanvas.width,
      y: Math.random() * starCanvas.height,
      r: Math.random() * 1.2 * devicePixelRatio + 0.2,
      a: Math.random() * 0.6 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.8,
      tint: Math.random() < 0.15
    }));
  }
  function drawStars(t) {
    sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
    for (const s of stars) {
      const tw = (Math.sin(t * 0.001 * s.speed + s.phase) + 1) / 2;
      const alpha = s.a * (0.4 + tw * 0.6);
      sctx.beginPath();
      sctx.fillStyle = s.tint
        ? `rgba(255, 140, 110, ${alpha})`
        : `rgba(255, 230, 210, ${alpha})`;
      sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      sctx.fill();
    }
  }

  // ---------- Embers ----------
  const emberCanvas = document.getElementById('embers');
  const ectx = emberCanvas.getContext('2d');
  let embers = [];
  function spawnEmber() {
    return {
      x: Math.random() * emberCanvas.width,
      y: emberCanvas.height + Math.random() * 50,
      vx: (Math.random() - 0.5) * 0.3 * devicePixelRatio,
      vy: -(0.3 + Math.random() * 0.7) * devicePixelRatio,
      r: (Math.random() * 1.6 + 0.6) * devicePixelRatio,
      life: 0,
      maxLife: 280 + Math.random() * 320,
      drift: Math.random() * Math.PI * 2
    };
  }
  function initEmbers() {
    sizeCanvas(emberCanvas);
    const count = Math.floor((window.innerWidth * window.innerHeight) / 22000);
    embers = Array.from({ length: count }, () => {
      const e = spawnEmber();
      e.y = Math.random() * emberCanvas.height;
      e.life = Math.random() * e.maxLife;
      return e;
    });
  }
  function drawEmbers(t) {
    ectx.clearRect(0, 0, emberCanvas.width, emberCanvas.height);
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.life++;
      e.drift += 0.01;
      e.x += e.vx + Math.sin(e.drift) * 0.15 * devicePixelRatio;
      e.y += e.vy;
      if (e.life > e.maxLife || e.y < -20) { embers[i] = spawnEmber(); continue; }
      const fade = 1 - (e.life / e.maxLife);
      const alpha = Math.min(1, fade * 1.2) * 0.85;
      const grad = ectx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 4);
      grad.addColorStop(0, `rgba(255, 180, 120, ${alpha})`);
      grad.addColorStop(0.4, `rgba(255, 90, 50, ${alpha * 0.6})`);
      grad.addColorStop(1, `rgba(180, 40, 20, 0)`);
      ectx.fillStyle = grad;
      ectx.beginPath(); ectx.arc(e.x, e.y, e.r * 4, 0, Math.PI * 2); ectx.fill();
      ectx.fillStyle = `rgba(255, 220, 180, ${alpha})`;
      ectx.beginPath(); ectx.arc(e.x, e.y, e.r * 0.6, 0, Math.PI * 2); ectx.fill();
    }
  }

  function loop(t) { drawStars(t); drawEmbers(t); requestAnimationFrame(loop); }
  function init() { initStars(); initEmbers(); }
  init();
  requestAnimationFrame(loop);

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(init, 150);
  });
})();
</script>
</body>
</html>
