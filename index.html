<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Hells Heaven</title>
<meta name="description" content="Hells Heaven" />
<style>
  :root {
    --ember: #c2453a;
    --ember-bright: #ff6a4d;
    --gold: #b58a4a;
    --parch: #d8c9a4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Cinzel', 'Trajan Pro', Georgia, serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    cursor: default;
  }

  /* ---------- Background layers ---------- */
  .bg {
    position: fixed; inset: 0;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1);
    will-change: transform;
  }
  .bg-desktop { background-image: url('bg-desktop.jpg'); }
  .bg-mobile  { background-image: url('bg-mobile.jpg'); display: none; }

  @media (max-aspect-ratio: 1/1) {
    .bg-desktop { display: none; }
    .bg-mobile  { display: block; }
  }

  /* Vignette */
  .vignette {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.55) 80%, rgba(0,0,0,.85) 100%);
    pointer-events: none;
    z-index: 1;
  }

  #stars  { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  #embers { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  /* ---------- Scene container ---------- */
  /* Pinned to the top of the viewport at full viewport height — the logo lives here in every view.
     Pointer-events disabled so it never blocks dashboard scroll/click. */
  .scene {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100vh;
    z-index: 4;
    perspective: 1400px;
    perspective-origin: 50% 50%;
    pointer-events: none;
  }

  /* ---------- Logo cluster (positioned absolutely, transitions via transform/size) ---------- */
  /* Logo movement is the anchor of every transition between views.
     Long duration + soft ease-in-out so the eye follows it through the change.
     All positions use viewport units (vh/vw) so the reference frame is consistent. */
  .logo-cluster {
    position: absolute;
    top: 50vh;
    left: 50vw;
    width: min(72vmin, 760px);
    height: min(72vmin, 760px);
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    transition: transform 2.0s cubic-bezier(.65, 0, .35, 1),
                width     2.0s cubic-bezier(.65, 0, .35, 1),
                height    2.0s cubic-bezier(.65, 0, .35, 1),
                top       2.0s cubic-bezier(.65, 0, .35, 1),
                left      2.0s cubic-bezier(.65, 0, .35, 1);
  }
  body.view-lore .logo-cluster {
    width: min(46vmin, 460px);
    height: min(46vmin, 460px);
    top: 50vh;
    left: 19vw;
    transform: translate(-50%, -50%);
  }

  .ring {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.55;
    mix-blend-mode: screen;
  }
  .ring svg { width: 100%; height: 100%; display: block; }
  .ring-outer { animation: spin 90s linear infinite; }
  .ring-mid   { animation: spin 60s linear infinite reverse; width: 78%; height: 78%; opacity: .4; }
  .ring-inner { animation: spin 40s linear infinite; width: 56%; height: 56%; opacity: .35; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-wrap {
    position: relative;
    width: 84%; height: 84%;
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1);
  }

  .logo-glow {
    position: absolute;
    inset: -8%;
    background: radial-gradient(circle at center, rgba(194,69,58,.55) 0%, rgba(194,69,58,.18) 35%, transparent 65%);
    filter: blur(40px);
    animation: pulse 4.5s ease-in-out infinite;
    transform: translateZ(-60px);
    pointer-events: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: .55; transform: translateZ(-60px) scale(1); }
    50%      { opacity: .85; transform: translateZ(-60px) scale(1.08); }
  }

  .logo {
    position: relative;
    width: 100%; height: 100%;
    background: url('logo-clean.png') center / contain no-repeat;
    filter:
      drop-shadow(0 18px 28px rgba(0,0,0,.85))
      drop-shadow(0 0 28px rgba(194,69,58,.45))
      drop-shadow(0 0 60px rgba(194,69,58,.25));
    transform: translateZ(40px);
    animation: float 6.5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateZ(40px) translateY(0); }
    50%      { transform: translateZ(50px) translateY(-8px); }
  }

  /* ---------- Lore button (on landing) ---------- */
  .lore-btn {
    position: fixed;
    bottom: 6.5vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    padding: 14px 38px;
    background: linear-gradient(180deg, rgba(40,8,8,.55) 0%, rgba(20,4,4,.65) 100%);
    color: var(--parch);
    border: 1px solid rgba(194,69,58,.55);
    border-radius: 999px;
    font-family: inherit;
    font-size: clamp(12px, 1.6vmin, 16px);
    letter-spacing: .45em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 20px rgba(194,69,58,.25), inset 0 0 12px rgba(0,0,0,.55);
    transition: all .35s ease;
    text-decoration: none;
  }
  .lore-btn:hover {
    color: #fff;
    border-color: rgba(255,140,90,.9);
    box-shadow: 0 0 32px rgba(255,106,77,.55), inset 0 0 16px rgba(0,0,0,.65);
    transform: translateX(-50%) translateY(-2px);
  }

  /* ---------- Back button (on lore) ---------- */
  .back-btn {
    position: fixed;
    top: 22px; left: 22px;
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: rgba(20,6,6,.55);
    color: var(--parch);
    border: 1px solid rgba(194,69,58,.45);
    border-radius: 999px;
    font-family: inherit;
    font-size: clamp(10px, 1.3vmin, 13px);
    letter-spacing: .35em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all .25s ease;
    text-decoration: none;
  }
  .back-btn:hover {
    color: #fff;
    border-color: rgba(255,140,90,.85);
    box-shadow: 0 0 22px rgba(255,106,77,.45);
  }
  .back-btn svg { width: 14px; height: 14px; }

  /* ---------- Landing-only / Lore-only visibility ----------
     Default = the "entering" state: slow fade-in, delayed until after the logo has moved. */
  .landing-only { transition: opacity 1.1s ease 1.0s; }
  .lore-only    { transition: opacity 1.1s ease 1.0s; }
  /* Hidden state: fade out faster so old content gets out of the logo's way quickly. */
  body.view-landing .lore-only    { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  body.view-lore    .landing-only { opacity: 0; pointer-events: none; transition: opacity .45s ease; }

  /* ---------- Timeline ---------- */
  .timeline-wrap {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    left: 38vw;
    max-width: 760px;
    padding: 7vh 4vmin 6vh 4vmin;
    display: flex; flex-direction: column;
    pointer-events: auto;       /* scene above has pointer-events:none */
    transition: opacity 1.1s ease 1.0s;
  }
  .timeline-title {
    text-align: center;
    font-size: clamp(14px, 1.9vmin, 20px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: rgba(216,201,164,.75);
    margin-bottom: 2.2em;
    padding-left: .55em;
    text-shadow: 0 0 16px rgba(194,69,58,.45);
  }

  .timeline {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    padding: 1em 24px 4em 56px;
    scrollbar-width: thin;
    scrollbar-color: rgba(194,69,58,.55) transparent;
    mask-image: linear-gradient(180deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 7%, #000 93%, transparent 100%);
  }
  .timeline::-webkit-scrollbar { width: 6px; }
  .timeline::-webkit-scrollbar-track { background: transparent; }
  .timeline::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(194,69,58,.55), rgba(120,20,12,.6));
    border-radius: 6px;
  }

  /* Inner track grows with content; the line sits on it so it spans every event */
  .timeline-track {
    position: relative;
    padding: 14px 0;
  }
  .timeline-track::before {
    content: "";
    position: absolute;
    /* Line center sits at the same x as the bullet center; -25px accounts for the 1px border on .ev */
    left: -25px;
    top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(180deg,
      rgba(194,69,58,.0) 0%,
      rgba(194,69,58,.7) 2%,
      rgba(194,69,58,.7) 98%,
      rgba(194,69,58,.0) 100%);
    box-shadow: 0 0 10px rgba(194,69,58,.55);
  }

  .ev {
    position: relative;
    padding: 14px 22px 14px 38px;
    margin-bottom: 14px;
    border: 1px solid rgba(194,69,58,.22);
    background: linear-gradient(135deg, rgba(20,4,4,.45), rgba(40,10,10,.25));
    border-radius: 10px;
    cursor: pointer;
    transition: transform .35s cubic-bezier(.2,.8,.2,1),
                border-color .35s ease,
                background .35s ease,
                box-shadow .35s ease;
    backdrop-filter: blur(2px);
  }
  .ev::before {
    /* Bullet on the line */
    content: "";
    position: absolute;
    left: -32px; top: 50%;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff8a5a, #6a1a10 70%);
    box-shadow: 0 0 12px rgba(255,106,77,.85), 0 0 22px rgba(194,69,58,.4);
    transform: translateY(-50%);
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .ev::after {
    /* Connector line from bullet to card */
    content: "";
    position: absolute;
    left: -18px; top: 50%;
    width: 22px;
    height: 1px;
    background: linear-gradient(90deg, rgba(194,69,58,.55), transparent);
    transform: translateY(-50%);
  }

  .ev:hover {
    transform: translateX(6px);
    border-color: rgba(255,140,90,.7);
    background: linear-gradient(135deg, rgba(50,12,12,.6), rgba(80,20,12,.35));
    box-shadow: 0 0 26px rgba(194,69,58,.35);
  }
  .ev:hover::before {
    transform: translateY(-50%) scale(1.25);
    box-shadow: 0 0 18px rgba(255,150,100,1), 0 0 32px rgba(255,106,77,.6);
  }

  .ev .ev-name {
    font-size: clamp(13px, 1.7vmin, 17px);
    color: #f3e7d0;
    letter-spacing: .08em;
    line-height: 1.35;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  .ev .ev-time {
    margin-top: 6px;
    font-size: clamp(10px, 1.25vmin, 12px);
    color: rgba(216,201,164,.6);
    letter-spacing: .3em;
    text-transform: uppercase;
    font-family: Georgia, serif;
    font-style: italic;
  }

  /* ---------- HHX Alternative Timeline (disconnected card below the chronicle) ---------- */
  .alt-timeline-wrap {
    position: relative;
    margin: 4.5em 0 2em -28px;
    padding-right: 24px;
  }
  .alt-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 0 0 2.2em;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: clamp(11px, 1.4vmin, 14px);
    letter-spacing: .35em;
    text-transform: uppercase;
    color: rgba(180,140,90,.7);
    text-shadow: 0 0 14px rgba(120,40,90,.45);
  }
  .alt-divider::before,
  .alt-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg,
      rgba(180,140,90,0) 0%,
      rgba(180,140,90,.55) 50%,
      rgba(180,140,90,0) 100%);
  }
  .alt-divider span {
    white-space: nowrap;
    padding: 0 .4em;
  }
  .ev.alt-ev {
    margin-left: 18px;
    margin-right: 4px;
    padding: 18px 22px;
    border-style: dashed;
    border-color: rgba(150,80,160,.45);
    background: linear-gradient(135deg, rgba(30,8,40,.55), rgba(50,12,60,.30));
    box-shadow:
      0 0 18px rgba(150,80,200,.25),
      inset 0 0 14px rgba(0,0,0,.55);
  }
  .ev.alt-ev::before {
    display: none;     /* no bullet — disconnected from the timeline */
  }
  .ev.alt-ev::after { display: none; }
  .ev.alt-ev .ev-name {
    background: linear-gradient(90deg, #d6b0ff 0%, #ffe0a0 50%, #d6b0ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 14px rgba(180,120,220,.45);
  }
  .ev.alt-ev:hover {
    transform: translateY(-2px);
    border-color: rgba(220,160,255,.65);
    box-shadow:
      0 0 28px rgba(180,120,220,.4),
      inset 0 0 14px rgba(0,0,0,.55);
  }

  /* ---------- Locked / sealed event ---------- */
  .ev.locked {
    background: linear-gradient(135deg, rgba(14,3,3,.55), rgba(28,8,8,.30));
    border-color: rgba(120,90,40,.35);
    padding-right: 78px;            /* room for the seal band on the right */
  }
  .ev.locked .ev-name { color: rgba(216,201,164,.7); }
  .ev.locked .ev-time { color: rgba(216,201,164,.45); }

  /* Right-side seal band (vertical chain + padlock) */
  .chain-band {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 62px;
    pointer-events: none;
    overflow: hidden;
    border-top-right-radius: inherit;
    border-bottom-right-radius: inherit;
    background: linear-gradient(270deg, rgba(60,18,8,.45) 0%, rgba(60,18,8,0) 100%);
    border-left: 1px solid rgba(180,140,60,.18);
  }
  .chain-band svg {
    position: absolute;
    top: 50%; left: 50%;
    width: 20px; height: 100%;
    transform: translate(-50%, -50%);
    opacity: .55;
  }
  /* Padlock icon centered on the seal band */
  .seal-icon {
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    color: rgba(216,170,90,.9);
    filter: drop-shadow(0 0 8px rgba(194,69,58,.45));
    transition: transform .35s ease;
    pointer-events: none;
  }
  .seal-icon svg { width: 100%; height: 100%; }

  .ev.locked:hover {
    transform: translateX(4px);
    border-color: rgba(180,140,60,.7);
    background: linear-gradient(135deg, rgba(30,12,8,.55), rgba(50,18,10,.30));
    box-shadow: 0 0 22px rgba(120,90,40,.45);
  }
  .ev.locked:hover .seal-icon  { transform: translateY(-50%) rotate(-8deg) scale(1.08); }
  .ev.locked:hover .chain-band { background: linear-gradient(270deg, rgba(80,24,10,.6) 0%, rgba(80,24,10,0) 100%); }
  .ev.locked:hover .chain-band svg { opacity: .85; }

  /* ---------- Seal modal (mystical "unavailable" message) ---------- */
  .seal-modal {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,.85) 100%);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .55s ease;
  }
  .seal-modal.open { opacity: 1; pointer-events: auto; }
  .seal-card {
    position: relative;
    max-width: min(540px, 86vw);
    padding: 56px 48px 48px;
    text-align: center;
    background:
      radial-gradient(ellipse at top, rgba(60,16,12,.55) 0%, rgba(20,6,6,.85) 80%);
    border: 1px solid rgba(194,69,58,.55);
    border-radius: 10px;
    box-shadow:
      0 0 48px rgba(194,69,58,.4),
      0 0 90px rgba(120,30,12,.35),
      inset 0 0 36px rgba(0,0,0,.65);
    color: var(--parch);
    transform: scale(.92) translateY(8px);
    transition: transform .55s cubic-bezier(.2,.8,.2,1);
  }
  .seal-modal.open .seal-card { transform: scale(1) translateY(0); }

  /* Decorative corner sigils via pseudo-elements */
  .seal-card::before, .seal-card::after {
    content: "";
    position: absolute;
    width: 60px; height: 60px;
    border: 1px solid rgba(216,170,90,.55);
    border-radius: 2px;
  }
  .seal-card::before {
    top: 10px; left: 10px;
    border-right: none; border-bottom: none;
  }
  .seal-card::after {
    bottom: 10px; right: 10px;
    border-left: none; border-top: none;
  }

  .seal-glyph {
    width: 56px; height: 56px;
    margin: 0 auto 22px;
    color: rgba(255,170,110,.85);
    filter: drop-shadow(0 0 18px rgba(255,106,77,.55));
    animation: sealPulse 3.2s ease-in-out infinite;
  }
  .seal-glyph svg { width: 100%; height: 100%; }
  @keyframes sealPulse {
    0%, 100% { opacity: .65; filter: drop-shadow(0 0 12px rgba(255,106,77,.45)); }
    50%      { opacity: 1;   filter: drop-shadow(0 0 22px rgba(255,140,90,.75)); }
  }

  .seal-title {
    font-family: inherit;
    font-size: clamp(18px, 2.8vmin, 28px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 18px;
    text-shadow: 0 0 22px rgba(194,69,58,.65), 0 2px 6px rgba(0,0,0,.9);
    padding-left: .55em;
  }
  .seal-divider {
    width: 60%;
    height: 1px;
    margin: 4px auto 22px;
    background: linear-gradient(90deg, transparent, rgba(216,170,90,.6), transparent);
  }
  .seal-msg {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: clamp(13px, 1.7vmin, 17px);
    color: rgba(216,201,164,.85);
    line-height: 1.7;
    letter-spacing: .04em;
  }
  .seal-sub {
    margin-top: 18px;
    font-size: clamp(10px, 1.2vmin, 12px);
    letter-spacing: .4em;
    text-transform: uppercase;
    color: rgba(216,170,90,.55);
  }
  .seal-close {
    position: absolute;
    top: 14px; right: 14px;
    width: 32px; height: 32px;
    background: none;
    border: 1px solid rgba(216,170,90,.5);
    border-radius: 50%;
    color: rgba(216,170,90,.85);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 16px;
    transition: all .25s ease;
  }
  .seal-close:hover {
    background: rgba(194,69,58,.25);
    color: #fff;
    box-shadow: 0 0 14px rgba(255,106,77,.55);
  }

  /* ---------- Enter overlay (click to enter) ---------- */
  .enter {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,.92) 100%);
    backdrop-filter: blur(2px);
    z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 1.6s ease-out;
    color: rgba(255, 220, 200, .85);
    font-family: inherit;
    letter-spacing: .35em;
    text-transform: uppercase;
    user-select: none;
  }
  .enter.hidden { opacity: 0; pointer-events: none; }
  .enter .enter-title {
    font-size: clamp(14px, 2.2vmin, 22px);
    text-shadow: 0 0 18px rgba(194,69,58,.55), 0 2px 6px rgba(0,0,0,.9);
    animation: enterPulse 2.6s ease-in-out infinite;
    padding: .4em 0;
  }
  .enter .enter-sub {
    font-size: clamp(10px, 1.4vmin, 14px);
    margin-top: 1.4em;
    opacity: .55;
    letter-spacing: .5em;
  }
  @keyframes enterPulse {
    0%, 100% { opacity: .65; }
    50%      { opacity: 1;   }
  }

  /* ---------- Mute toggle ---------- */
  .mute-btn {
    position: fixed;
    bottom: 22px; right: 22px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(20, 6, 6, .55);
    border: 1px solid rgba(194, 69, 58, .55);
    color: rgba(255, 210, 180, .9);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 90;
    transition: background .25s, transform .25s, box-shadow .25s;
    backdrop-filter: blur(4px);
    box-shadow: 0 0 18px rgba(194,69,58,.25);
  }
  .mute-btn:hover {
    background: rgba(40, 10, 10, .8);
    transform: scale(1.08);
    box-shadow: 0 0 26px rgba(194,69,58,.6);
  }
  .mute-btn svg { width: 22px; height: 22px; }

  /* ========================================================
     HH DASHBOARD (view-hh1 .. view-hh8)
     ======================================================== */

  /* Show dashboard only on hh-* views */
  .dashboard-only { transition: opacity 1.1s ease 1.0s; }   /* fade in after logo arrives */
  body.view-landing .dashboard-only,
  body.view-lore    .dashboard-only { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  body[class*="view-hh"] .landing-only,
  body[class*="view-hh"] .lore-only { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  /* Logo position on dashboard views — uses viewport units to match landing/lore reference frame. */
  body[class*="view-hh"] .logo-cluster {
    top: 16vh;
    left: 50vw;
    width: min(22vmin, 260px);
    height: min(22vmin, 260px);
    transform: translate(-50%, -50%);
  }
  /* Allow page to scroll on dashboard views */
  body[class*="view-hh"] { overflow-y: auto; overflow-x: hidden; }
  body.view-hof { overflow-y: auto; overflow-x: hidden; }

  /* ---------- Hall of Fame portal (lore page entry) ---------- */
  .hof-portal {
    display: block;
    text-align: center;
    margin: 0 0 1.8em;
    padding: 14px 18px 16px;
    text-decoration: none;
    border: 1px solid rgba(216,170,90,.4);
    border-radius: 10px;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(216,170,90,.15), rgba(0,0,0,0) 70%),
      linear-gradient(135deg, rgba(36,12,30,.55), rgba(20,6,22,.35));
    box-shadow:
      0 0 24px rgba(216,170,90,.18),
      inset 0 0 18px rgba(0,0,0,.55);
    transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
    position: relative;
    overflow: hidden;
  }
  .hof-portal::before {
    content: "";
    position: absolute;
    inset: -50%;
    background: conic-gradient(from 0deg, rgba(216,170,90,0), rgba(216,170,90,.25), rgba(216,170,90,0) 30%);
    animation: hofPortalSpin 9s linear infinite;
    opacity: .55;
    pointer-events: none;
  }
  @keyframes hofPortalSpin {
    to { transform: rotate(1turn); }
  }
  .hof-portal:hover {
    transform: translateY(-2px);
    border-color: rgba(255,200,120,.75);
    box-shadow:
      0 0 36px rgba(255,170,90,.4),
      inset 0 0 18px rgba(0,0,0,.55);
  }
  .hof-portal-label {
    position: relative;
    display: block;
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(16px, 2.1vmin, 22px);
    letter-spacing: .35em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #f0d488 0%, #fff1c1 50%, #f0d488 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 16px rgba(216,170,90,.45);
  }
  .hof-portal-sub {
    position: relative;
    display: block;
    margin-top: 6px;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: clamp(11px, 1.35vmin, 13px);
    letter-spacing: .12em;
    color: rgba(216,201,164,.7);
  }

  /* ---------- Hall of Fame view ---------- */
  body.view-hof .landing-only,
  body.view-hof .lore-only,
  body.view-hof .scene { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
  body.view-hof .scene { display: none; }
  body.view-hof .logo-cluster { display: none; }

  .hof {
    position: relative;
    z-index: 6;
    width: 100%;
    min-height: 100vh;
    color: #f3e7d0;
    opacity: 0;
    transition: opacity 1.1s ease .2s;
    overflow-x: hidden;
  }
  body.view-hof .hof { opacity: 1; }

  .hof-tunnel {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center,
        rgba(60,16,30,.85) 0%,
        rgba(20,6,14,.95) 50%,
        rgba(4,2,6,1) 100%);
  }

  .hof-content {
    position: relative;
    z-index: 1;
    max-width: 1280px;
    margin: 0 auto;
    padding: 8vh 5vw 14vh;
  }

  /* Entrance hero */
  .hof-entrance {
    text-align: center;
    padding: 14vh 0 8vh;
    perspective: 1400px;
    position: relative;
  }
  .hof-entrance::before {
    /* Concentric tunnel rings receding */
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 45%, rgba(216,170,90,0) 30%, rgba(216,170,90,.06) 40%, rgba(216,170,90,0) 41%),
      radial-gradient(circle at 50% 45%, rgba(216,170,90,0) 45%, rgba(216,170,90,.08) 55%, rgba(216,170,90,0) 56%),
      radial-gradient(circle at 50% 45%, rgba(216,170,90,0) 60%, rgba(216,170,90,.06) 70%, rgba(216,170,90,0) 71%);
    animation: hofRings 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes hofRings {
    0%, 100% { transform: scale(1) translateZ(0); opacity: .55; }
    50%      { transform: scale(1.06) translateZ(20px); opacity: 1; }
  }
  .hof-eyebrow {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(11px, 1.4vmin, 14px);
    letter-spacing: .65em;
    text-transform: uppercase;
    color: rgba(216,170,90,.75);
    text-shadow: 0 0 12px rgba(216,170,90,.4);
    padding-left: .65em;
    margin-bottom: 1.4em;
  }
  .hof-title {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 900;
    font-size: clamp(54px, 11vmin, 130px);
    letter-spacing: .04em;
    margin: 0;
    line-height: 1;
    background: linear-gradient(180deg, #fff5d5 0%, #f0c878 35%, #b58a4a 65%, #6e4818 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow:
      0 0 36px rgba(216,170,90,.5),
      0 0 80px rgba(194,69,58,.35);
    animation: hofTitlePulse 5s ease-in-out infinite;
  }
  @keyframes hofTitlePulse {
    0%, 100% { filter: drop-shadow(0 0 28px rgba(216,170,90,.35)); }
    50%      { filter: drop-shadow(0 0 56px rgba(216,170,90,.6)); }
  }
  .hof-flourish {
    width: 70%;
    max-width: 580px;
    height: 18px;
    margin: 2em auto 1.8em;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(216,170,90,.85) 0%, rgba(216,170,90,0) 70%),
      linear-gradient(90deg, rgba(216,170,90,0) 0%, rgba(216,170,90,.7) 50%, rgba(216,170,90,0) 100%);
    background-size: 30px 18px, 100% 1px;
    background-repeat: no-repeat, no-repeat;
    background-position: center, center;
  }
  .hof-lede {
    max-width: 760px;
    margin: 0 auto;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: clamp(14px, 1.7vmin, 19px);
    line-height: 1.7;
    color: rgba(243,231,208,.78);
  }
  .hof-scroll {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-top: 4.5em;
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(10px, 1.2vmin, 12px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: rgba(216,170,90,.6);
    text-shadow: 0 0 14px rgba(216,170,90,.35);
    padding-left: .55em;
    pointer-events: none;
  }
  .hof-scroll svg {
    width: 22px;
    height: 12px;
    display: block;
    margin-left: -.55em;   /* undo the letter-spacing pad so the chevron sits centred */
    animation: hofScrollBob 2.2s ease-in-out infinite;
  }
  @keyframes hofScrollBob {
    0%, 100% { transform: translateY(-4px); opacity: .45; }
    50%      { transform: translateY(4px);  opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hof-scroll svg { animation: none; }
  }

  /* Sections */
  .hof-section {
    margin-top: 6vh;
    padding-top: 1.5em;
    position: relative;
  }
  .hof-section-title {
    text-align: center;
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(20px, 3vmin, 32px);
    letter-spacing: .35em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffe9b9 0%, #d4a85a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-left: .35em;
    margin: 0 0 1.6em;
    text-shadow: 0 0 18px rgba(216,170,90,.35);
    position: relative;
  }
  .hof-section-title::after {
    content: "✦";
    display: block;
    margin: 0.45em auto 0;
    color: rgba(216,170,90,.6);
    font-size: .55em;
    -webkit-text-fill-color: rgba(216,170,90,.6);
    background: none;
  }

  /* Card grid */
  .hof-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 22px;
  }
  .hof-card {
    position: relative;
    padding: 22px 22px 20px;
    border: 1px solid rgba(216,170,90,.32);
    border-radius: 10px;
    background:
      linear-gradient(180deg, rgba(40,12,28,.55), rgba(18,5,16,.7));
    box-shadow:
      0 0 22px rgba(120,30,80,.18),
      inset 0 0 18px rgba(0,0,0,.5);
    backdrop-filter: blur(2px);
    transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
    transform-style: preserve-3d;
  }
  .hof-card.wide { grid-column: span 2; }
  @media (max-width: 720px) { .hof-card.wide { grid-column: span 1; } }

  /* The full record. A long table should sit still while it is being read, so this
     card opts out of the lift the others get on hover. */
  .hof-card.plain:hover { transform: none; }
  .hof-table-wrap { overflow-x: auto; margin-top: 4px; }
  .hof-table { width: 100%; border-collapse: collapse; font-family: 'Cinzel', Georgia, serif; }
  .hof-table th,
  .hof-table td { padding: 8px 10px; text-align: right; white-space: nowrap; }
  .hof-table th:nth-child(2),
  .hof-table td:nth-child(2) { text-align: left; width: 99%; }
  .hof-table thead th {
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(216,170,90,.8);
    border-bottom: 1px solid rgba(216,170,90,.3);
    cursor: pointer;
    user-select: none;
  }
  .hof-table thead th:first-child { cursor: default; }
  .hof-table thead th:hover { color: rgba(255,210,140,1); }
  .hof-table .sort-mark { font-size: 8px; padding-left: 6px; opacity: .75; }
  .hof-table tbody tr { border-bottom: 1px dashed rgba(216,170,90,.12); }
  .hof-table tbody tr:hover { background: rgba(216,170,90,.06); }
  .hof-table td {
    font-size: 13px;
    color: rgba(243,231,208,.92);
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  .hof-table td.rank { color: rgba(216,170,90,.5); font-size: 11px; text-align: right; }
  .hof-table td.name { font-size: 14px; letter-spacing: .02em; }
  .hof-table td.rate { color: rgba(255,200,110,.95); }
  .hof-card:hover {
    transform: translateY(-3px) rotateX(2deg);
    border-color: rgba(255,200,120,.55);
    box-shadow:
      0 0 32px rgba(255,170,90,.3),
      inset 0 0 18px rgba(0,0,0,.5);
  }
  .hof-card h3 {
    margin: 0 0 .9em;
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(13px, 1.6vmin, 16px);
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #f3e7d0;
    text-shadow: 0 0 10px rgba(255,140,90,.35);
  }
  .hof-cond {
    font-size: .75em;
    color: rgba(216,201,164,.6);
    letter-spacing: .15em;
    font-style: italic;
  }
  .hof-desc {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 12.5px;
    color: rgba(216,201,164,.65);
    margin: -.5em 0 1em;
    line-height: 1.5;
  }
  .hof-rank {
    list-style: none;
    margin: 0;
    padding: 0;
    counter-reset: hofitem;
  }
  .hof-rank > li {
    counter-increment: hofitem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px dashed rgba(216,170,90,.15);
    font-family: Georgia, serif;
    font-size: 14px;
    color: rgba(243,231,208,.92);
  }
  .hof-rank > li:last-child { border-bottom: none; }
  .hof-rank > li::before {
    content: counter(hofitem);
    flex: 0 0 auto;
    width: 22px;
    text-align: center;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 12px;
    color: rgba(216,170,90,.6);
    margin-right: 4px;
  }
  .hof-rank > li b {
    flex: 1 1 auto;
    font-weight: 400;
    font-family: 'Cinzel', Georgia, serif;
    letter-spacing: .08em;
    color: #f3e7d0;
  }
  .hof-rank .hof-val {
    flex: 0 0 auto;
    font-family: 'Cinzel', Georgia, serif;
    color: rgba(255,180,120,.95);
    font-weight: 600;
    text-shadow: 0 0 8px rgba(255,140,80,.35);
  }
  .hof-rank .hof-val i {
    font-style: normal;
    font-size: .82em;
    color: rgba(216,201,164,.55);
    margin-left: 6px;
  }
  .hof-namestrip {
    font-family: 'Cinzel', Georgia, serif;
    letter-spacing: .12em;
    line-height: 1.9;
    color: #f3e7d0;
    margin: 0;
  }
  .hof-namestrip.muted { color: rgba(216,201,164,.55); }
  .hof-lineage {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .hof-lineage li {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 7px 0;
    border-bottom: 1px dashed rgba(216,170,90,.15);
  }
  .hof-lineage li:last-child { border-bottom: none; }
  /* Heads a run of lineage rows when one card holds more than one pairing. */
  .hof-nem {
    font-family: 'Cinzel', Georgia, serif;
    letter-spacing: .14em;
    font-size: 13.5px;
    color: #f3e7d0;
    margin: 1.5em 0 .5em;
  }
  .hof-nem span {
    color: rgba(216,170,90,.7);
    margin: 0 .4em;
  }
  /* Trails a ranked list to say something about whoever currently sits at the top. */
  .hof-under {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 12.5px;
    line-height: 1.5;
    color: rgba(216,201,164,.6);
    margin: 1.1em 0 0;
  }
  .hof-hh {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 11px;
    letter-spacing: .22em;
    color: rgba(216,170,90,.85);
    background: rgba(216,170,90,.08);
    padding: 2px 8px;
    border-radius: 3px;
    border: 1px solid rgba(216,170,90,.25);
    flex: 0 0 auto;
  }
  .hof-name {
    font-family: 'Cinzel', Georgia, serif;
    letter-spacing: .15em;
    color: #f3e7d0;
  }
  .hof-quote {
    margin: 2.6em auto 0;
    max-width: 760px;
    padding: 1.4em 1.6em;
    border-left: 2px solid rgba(216,170,90,.55);
    border-right: 2px solid rgba(216,170,90,.55);
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: clamp(13px, 1.6vmin, 17px);
    line-height: 1.7;
    color: rgba(243,231,208,.88);
    text-align: center;
    background: linear-gradient(180deg, rgba(40,12,30,.35), rgba(20,6,16,.45));
    text-shadow: 0 0 12px rgba(255,140,90,.18);
  }
  .hof-empty {
    color: rgba(216,201,164,.4);
    font-style: italic;
    padding: 8px 0;
  }
  .hof-foot {
    margin-top: 8vh;
    text-align: center;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 12px;
    letter-spacing: .55em;
    color: rgba(216,170,90,.55);
    text-shadow: 0 0 14px rgba(216,170,90,.3);
  }

  /* Back button on HOF view */
  body.view-hof .dash-back {
    display: flex !important;
    opacity: 1 !important;
    pointer-events: auto !important;
  }

  @media (max-width: 720px) {
    .hof-content { padding: 6vh 4vw 12vh; }
    .hof-entrance { padding: 8vh 0 5vh; }
    .hof-grid { gap: 14px; }
    .hof-card { padding: 18px 16px; }
  }

  .dashboard {
    position: relative;
    z-index: 5;
    width: 100%;
    min-height: 100vh;
    color: #f3e7d0;
    opacity: 0;
    transition: opacity 1.1s ease 1.0s;   /* arrives as the logo finishes its journey */
  }
  body[class*="view-hh"] .dashboard { opacity: 1; }

  /* Both views keep their rendered markup between navigations, so the inactive one
     would otherwise reserve a screen or more of empty space above the active one. */
  body:not([class*="view-hh"]) .dashboard,
  body:not(.view-hof) .hof {
    min-height: 0;
    height: 0;
    overflow: hidden;
  }

  /* ---------- HH Hero Header ---------- */
  .hh-header {
    padding: 32vh 4vmin 6vh;   /* leave room for the fixed logo cluster at the top */
    text-align: center;
    position: relative;
  }
  .hh-number {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(13px, 1.7vmin, 17px);
    letter-spacing: .85em;
    color: rgba(216,170,90,.85);
    padding-left: .85em;
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(194,69,58,.5);
  }
  .hh-title {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 600;
    font-size: clamp(28px, 5.2vmin, 56px);
    margin: 26px 0 22px;
    letter-spacing: .04em;
    color: #fff;
    line-height: 1.15;
    text-shadow:
      0 0 28px rgba(194,69,58,.65),
      0 0 56px rgba(120,30,12,.4),
      0 2px 8px rgba(0,0,0,.9);
    max-width: 1100px;
    margin-left: auto; margin-right: auto;
  }
  .hh-title-row { margin: 26px auto 22px; }
  .hh-time {
    font-family: Georgia, serif;
    font-style: italic;
    letter-spacing: .35em;
    color: rgba(216,170,90,.7);
    font-size: clamp(12px, 1.45vmin, 15px);
  }
  .hh-header-flourish {
    width: 60%;
    max-width: 360px;
    height: 1px;
    margin: 38px auto 0;
    background: linear-gradient(90deg, transparent, rgba(216,170,90,.6), transparent);
    position: relative;
  }
  .hh-header-flourish::before {
    content: "✦";
    position: absolute; top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px;
    color: rgba(216,170,90,.85);
    text-shadow: 0 0 18px rgba(255,140,90,.7), 0 0 6px rgba(0,0,0,.85);
  }

  /* ---------- Sections ---------- */
  .hh-section {
    padding: 7vh 5vmin;
    max-width: 960px;
    margin: 0 auto;
    position: relative;
  }
  .hh-section + .hh-section { padding-top: 4vh; }
  .hh-section-title {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(18px, 2.4vmin, 26px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: rgba(243,231,208,.92);
    text-align: center;
    margin-bottom: 36px;
    padding-left: .55em;
    text-shadow: 0 0 22px rgba(194,69,58,.5);
  }
  .hh-section-title::after {
    content: "";
    display: block;
    width: 220px; max-width: 60%;
    height: 1px;
    margin: 18px auto 0;
    background: linear-gradient(90deg, transparent, rgba(216,170,90,.55), transparent);
  }

  /* ---------- Lore prose ---------- */
  .lore-text {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(15px, 1.9vmin, 19px);
    line-height: 1.92;
    color: rgba(243,231,208,.95);
    letter-spacing: .015em;
    max-width: 740px;
    margin: 0 auto;
    text-align: justify;
    text-shadow: 0 1px 4px rgba(0,0,0,.85);
  }
  .lore-text::first-letter {
    font-family: 'Trajan Pro', Georgia, serif;
    font-size: 4.2em;
    float: left;
    line-height: .88;
    padding: 6px 12px 0 0;
    color: rgba(255,140,90,.95);
    text-shadow:
      0 0 24px rgba(255,106,77,.75),
      0 0 40px rgba(194,69,58,.4);
  }

  .lore-text + .lore-text { margin-top: 1.05em; }
  .lore-text.cont::first-letter {
    font-family: inherit; font-size: inherit; float: none; line-height: inherit;
    padding: 0; color: inherit; text-shadow: inherit;
  }
  .lore-epigraph {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(14px, 1.7vmin, 17px);
    line-height: 1.8;
    letter-spacing: .04em;
    color: rgba(216,170,90,.92);
    text-align: center;
    max-width: 620px;
    margin: 0 auto;
    text-shadow: 0 1px 4px rgba(0,0,0,.85);
  }
  .lore-epigraph + .lore-epigraph { margin-top: .6em; }
  .lore-epigraph + .lore-text { margin-top: 2.2em; }

  /* ---------- Setting (simple legendary text) ---------- */
  .setting-text {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(20px, 3.2vmin, 34px);
    letter-spacing: .35em;
    text-transform: uppercase;
    color: #f3e7d0;
    text-align: center;
    padding-left: .35em;
    text-shadow:
      0 0 22px rgba(255,140,90,.5),
      0 0 44px rgba(194,69,58,.3),
      0 2px 8px rgba(0,0,0,.9);
  }
  .setting-text .ampersand {
    color: rgba(216,170,90,.7);
    font-family: Georgia, serif;
    font-style: italic;
    margin: 0 .4em;
    text-transform: none;
  }

  /* ---------- Setting locations (stacked) ---------- */
  .setting-locations {
    list-style: none;
    padding: 0;
    margin: 0 auto;
    text-align: center;
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(16px, 2.2vmin, 22px);
    letter-spacing: .3em;
    text-transform: uppercase;
    color: #f3e7d0;
    line-height: 2.3;
  }
  .setting-locations li {
    position: relative;
    text-shadow:
      0 0 18px rgba(255,140,90,.45),
      0 0 36px rgba(194,69,58,.25),
      0 2px 6px rgba(0,0,0,.85);
  }
  .setting-locations li + li::before {
    content: "✦";
    position: absolute;
    top: -1.05em;
    left: 50%;
    transform: translateX(-50%);
    font-size: .55em;
    color: rgba(216,170,90,.45);
    text-shadow: 0 0 12px rgba(216,170,90,.4);
  }

  /* ---------- Participants grid ---------- */
  .participants-grid {
    list-style: none;
    padding: 0;
    margin: 0 auto;
    max-width: 1000px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px;
  }
  .participant-card {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(14px, 1.7vmin, 18px);
    letter-spacing: .12em;
    text-align: center;
    color: #f3e7d0;
    padding: 14px 12px;
    background:
      linear-gradient(180deg, rgba(80,20,30,.35), rgba(40,10,20,.55));
    border: 1px solid rgba(216,170,90,.35);
    border-radius: 6px;
    box-shadow:
      0 0 16px rgba(194,69,58,.18),
      inset 0 0 14px rgba(0,0,0,.45);
    text-shadow:
      0 0 10px rgba(255,140,90,.35),
      0 2px 5px rgba(0,0,0,.85);
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .participant-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255,170,100,.7);
    box-shadow:
      0 0 22px rgba(255,106,77,.4),
      inset 0 0 16px rgba(0,0,0,.45);
  }

  /* ---------- Status section (ongoing) ---------- */
  .status-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3vmin;
    perspective: 1600px;
    perspective-origin: 50% 40%;
  }
  .servant-frame {
    position: relative;
    width: min(82vmin, 720px);
    aspect-ratio: 1086 / 1448;
    transform-style: preserve-3d;
    margin: 1vmin 0 0;
  }
  .servant-aura {
    display: none;
  }
  .servant-portrait {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transform: translateZ(0);
    will-change: transform;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.6));
    animation: servantFloat 7s ease-in-out infinite;
  }
  @keyframes servantFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-1.4%); }
  }

  /* ---------- Status: Ongoing ---------- */
  .status-ongoing {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4em;
    padding: 2em 0;
  }
  .status-ongoing-label {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(24px, 3.6vmin, 38px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: #f3e7d0;
    display: flex;
    align-items: center;
    gap: .9em;
    text-shadow:
      0 0 24px rgba(255,140,90,.55),
      0 0 48px rgba(194,69,58,.3),
      0 2px 8px rgba(0,0,0,.9);
  }
  .status-pulse {
    width: .55em;
    height: .55em;
    border-radius: 50%;
    background: #ff6a4d;
    box-shadow:
      0 0 12px #ff6a4d,
      0 0 28px rgba(255,106,77,.7),
      0 0 60px rgba(255,106,77,.4);
    animation: statusPulse 1.8s ease-in-out infinite;
  }
  @keyframes statusPulse {
    0%, 100% { opacity: .45; transform: scale(.85); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }
  .status-ongoing-note {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: clamp(13px, 1.6vmin, 16px);
    letter-spacing: .12em;
    color: rgba(216,170,90,.7);
    text-align: center;
    max-width: 36ch;
    line-height: 1.7;
  }

  /* ---------- Cast (Houses / Participants + Roles) ---------- */
  .cast-factions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6vmin;
    max-width: 1080px;
    margin: 0 auto;
  }
  .cast-factions[data-factions="3"] {
    grid-template-columns: 1fr 1fr 1fr;
    max-width: 1280px;
    gap: 4vmin;
  }
  .cast-faction {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .cast-faction-sigil {
    width: clamp(70px, 9vmin, 100px);
    height: clamp(70px, 9vmin, 100px);
    animation: floatGently 5.5s ease-in-out infinite;
  }
  .cast-faction-sigil img { width: 100%; height: 100%; object-fit: contain; }
  .cast-faction-sigil.sigil-inline { color: rgba(220,190,255,.85); }
  .cast-faction-sigil.sigil-inline svg { width: 100%; height: 100%; }
  .faction-angel    { --accent: rgba(216,170,60,.7);  --glow: rgba(255,210,90,.55); }
  .faction-devil    { --accent: rgba(194,69,58,.7);   --glow: rgba(255,106,77,.55); }
  .faction-royalist { --accent: rgba(200,210,220,.7); --glow: rgba(220,230,240,.55); }
  .faction-rebel    { --accent: rgba(194,69,58,.7);   --glow: rgba(255,106,77,.55); }
  .faction-neutral  { --accent: rgba(180,140,210,.7); --glow: rgba(210,170,240,.55); }
  .faction-titan    { --accent: rgba(120,180,230,.7); --glow: rgba(140,210,255,.55); }
  .faction-angel    .cast-faction-sigil,
  .faction-devil    .cast-faction-sigil,
  .faction-royalist .cast-faction-sigil,
  .faction-rebel    .cast-faction-sigil,
  .faction-neutral  .cast-faction-sigil,
  .faction-titan    .cast-faction-sigil { filter: drop-shadow(0 0 20px var(--glow)); }
  .cast-faction-name {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(15px, 2vmin, 21px);
    letter-spacing: .55em;
    text-transform: uppercase;
    padding-left: .55em;
    text-shadow: 0 0 18px var(--glow);
  }
  .faction-angel    .cast-faction-name { color: #f5e8b8; }
  .faction-devil    .cast-faction-name { color: #f3c4b8; }
  .faction-royalist .cast-faction-name { color: #e8eef5; }
  .faction-rebel    .cast-faction-name { color: #f3c4b8; }
  .faction-neutral  .cast-faction-name { color: #e0cff0; }
  .faction-titan    .cast-faction-name { color: #cfe5f8; }

  .cast-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    width: 100%;
  }
  .player-card {
    display: flex; flex-direction: column;
    padding: 12px 18px;
    background: linear-gradient(135deg, rgba(20,4,4,.55), rgba(40,10,10,.25));
    border: 1px solid var(--accent);
    border-left-width: 3px;
    border-radius: 6px;
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease, background .3s ease;
  }
  .player-card:hover {
    transform: translateX(4px);
    background: linear-gradient(135deg, rgba(40,12,8,.6), rgba(60,18,10,.3));
    box-shadow: 0 0 22px var(--glow);
  }
  .player-card .role {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 10px;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: rgba(216,170,90,.75);
  }
  .player-card .tag {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(15px, 1.9vmin, 19px);
    color: #f3e7d0;
    margin-top: 4px;
    letter-spacing: .03em;
    text-shadow: 0 0 12px var(--glow);
  }
  /* Archetype badge — sits beside the name for chapters where the group a player
     belongs to and what they actually are are two different things. */
  .player-name-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .player-archetype {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 9px;
    letter-spacing: .3em;
    text-transform: uppercase;
    padding: 4px 10px 4px calc(10px + .3em);
    border: 1px solid rgba(200,180,230,.35);
    border-radius: 3px;
    color: rgba(214,198,240,.85);
    background: rgba(40,26,60,.35);
    white-space: nowrap;
  }
  .player-archetype.arch-serpent {
    border-color: rgba(120,215,150,.6);
    color: rgba(170,240,190,.95);
    background: rgba(14,44,26,.45);
    text-shadow: 0 0 14px rgba(120,215,150,.45);
  }
  .player-archetype.arch-man {
    border-color: rgba(240,205,140,.6);
    color: rgba(250,226,170,.95);
    background: rgba(52,38,14,.45);
    text-shadow: 0 0 14px rgba(240,205,140,.45);
  }
  /* Special highlight cards for headline roles */
  .player-card.headline {
    background: linear-gradient(135deg, rgba(60,18,12,.65), rgba(40,10,10,.3));
    border-color: var(--glow);
    box-shadow: inset 0 0 18px rgba(0,0,0,.4);
  }
  .player-card.headline .role { color: var(--glow); }

  /* ---------- Winning faction treatment ---------- */
  /* Sigil glow is unchanged from default. Name stays aligned with the losing faction's name;
     crown and "Victors" label are absolutely-positioned overlays so they add no vertical height. */
  .cast-faction.winner { --victor: rgba(255,200,110,.85); --victor-soft: rgba(255,180,80,.4); }
  .cast-faction.winner .cast-faction-name {
    position: relative;
  }
  .cast-faction.winner .faction-name-text {
    color: #fff8e8;
    text-shadow:
      0 0 22px var(--victor),
      0 0 44px var(--victor-soft),
      0 2px 8px rgba(0,0,0,.9);
  }
  .faction-crown {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    width: 38px;
    height: 22px;
    margin-bottom: 8px;
    color: var(--victor);
    filter: drop-shadow(0 0 10px var(--victor-soft));
    pointer-events: none;
  }
  .faction-crown svg { width: 100%; height: 100%; display: block; }
  .faction-victors {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 8px;
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(10px, 1.25vmin, 12px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: var(--victor);
    padding-left: .55em;
    text-shadow: 0 0 18px var(--victor-soft);
    white-space: nowrap;
    pointer-events: none;
  }

  /* A player who wins while their faction falls has no faction crown to stand under,
     so the card carries its own. */
  .player-card.won {
    --victor: rgba(255,200,110,.85);
    --victor-soft: rgba(255,180,80,.4);
    position: relative;
    padding-right: 92px;
  }
  .player-victor {
    position: absolute;
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    pointer-events: none;
  }
  .player-victor .player-crown {
    width: 32px;
    height: 19px;
    color: var(--victor);
    filter: drop-shadow(0 0 10px var(--victor-soft));
  }
  .player-victor .player-crown svg { width: 100%; height: 100%; display: block; }
  .player-victor .player-victor-label {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 9px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--victor);
    padding-left: .4em;
    text-shadow: 0 0 16px var(--victor-soft);
    white-space: nowrap;
  }

  /* The inverse of the victor badge: a player who won nothing although his faction did. */
  .player-card.fell {
    --fallen: rgba(176,166,156,.72);
    position: relative;
    padding-right: 72px;
  }
  .player-fate {
    position: absolute;
    top: 50%;
    right: 16px;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .player-fate .player-fate-label {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 9px;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--fallen);
    white-space: nowrap;
  }
  .cast-faction.winner .player-card.fell {
    box-shadow: 0 2px 6px rgba(0,0,0,.5), inset 0 -1px 0 rgba(0,0,0,.3);
    opacity: .72;
  }

  /* Victor player cards — slightly more 3D. Border/text colors stay with the faction palette;
     winner state adds depth shadows + a soft top highlight that feels lifted from the page. */
  .cast-faction.winner .player-card {
    box-shadow:
      0 6px 16px rgba(0,0,0,.55),
      0 2px 4px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 -1px 0 rgba(0,0,0,.35),
      0 0 22px var(--glow);
    transform: translateZ(0);
  }
  .cast-faction.winner .player-card:hover {
    transform: translateX(4px) translateY(-2px);
    box-shadow:
      0 10px 24px rgba(0,0,0,.6),
      0 3px 6px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -1px 0 rgba(0,0,0,.4),
      0 0 30px var(--glow);
  }

  /* ---------- MVP logo section title ---------- */
  .mvp-section-logo {
    width: 100%;
    text-align: center;
    margin-bottom: 28px;
  }
  .mvp-section-logo img {
    width: clamp(220px, 30vmin, 360px);
    height: auto;
    display: inline-block;
    animation: floatGently 5.2s ease-in-out infinite;
    filter:
      drop-shadow(0 10px 18px rgba(0,0,0,.85))
      drop-shadow(0 0 30px rgba(255,106,77,.65))
      drop-shadow(0 0 58px rgba(194,69,58,.4));
  }
  .mvp-section-logo::after {
    content: "";
    display: block;
    width: 240px; max-width: 60%;
    height: 1px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, rgba(216,170,90,.55), transparent);
  }

  /* ---------- MVP cards ---------- */
  .mvp-list {
    display: flex; flex-direction: column;
    gap: 36px;
    max-width: 780px;
    margin: 36px auto 0;
  }
  .mvp-card {
    position: relative;
    padding: 38px 36px;
    border: 1px solid rgba(216,170,90,.35);
    border-radius: 12px;
    background:
      radial-gradient(ellipse at top, rgba(70,18,12,.55) 0%, rgba(14,4,4,.55) 65%, rgba(8,2,2,.65) 100%);
    text-align: center;
    box-shadow:
      0 0 50px rgba(194,69,58,.18),
      inset 0 0 30px rgba(0,0,0,.45);
    backdrop-filter: blur(2px);
  }
  .mvp-card::before, .mvp-card::after {
    content: "";
    position: absolute;
    width: 56px; height: 56px;
    border: 1px solid rgba(216,170,90,.4);
    border-radius: 2px;
  }
  .mvp-card::before {
    top: 10px; left: 10px;
    border-right: none; border-bottom: none;
  }
  .mvp-card::after {
    bottom: 10px; right: 10px;
    border-left: none; border-top: none;
  }

  /* ---------- Rank tiers ---------- */
  .mvp-rank {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-bottom: 18px;
    line-height: 1;
  }
  .mvp-rank-label {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(10px, 1.25vmin, 12px);
    letter-spacing: .55em;
    text-transform: uppercase;
    color: rgba(216,170,90,.75);
    padding-left: .55em;
  }
  .mvp-rank-numeral {
    font-family: 'Trajan Pro', Georgia, serif;
    font-weight: 700;
    line-height: 1;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }

  /* TOP I  — supreme: bigger card, bigger numeral, brightest glow */
  .mvp-rank-1 {
    padding: 56px 44px 48px;
    border-color: rgba(255,170,80,.65);
    background:
      radial-gradient(ellipse at top, rgba(120,32,18,.65) 0%, rgba(40,10,8,.6) 60%, rgba(8,2,2,.7) 100%);
    box-shadow:
      0 0 70px rgba(255,140,90,.35),
      0 0 130px rgba(194,69,58,.25),
      inset 0 0 36px rgba(0,0,0,.45);
  }
  .mvp-rank-1 .mvp-rank-label { color: rgba(255,210,140,1); text-shadow: 0 0 18px rgba(255,140,90,.7); }
  .mvp-rank-1 .mvp-rank-numeral {
    font-size: clamp(48px, 8vmin, 88px);
    background-image: linear-gradient(180deg, #ffd98a 0%, #f0a64a 40%, #c45a2a 100%);
    filter: drop-shadow(0 0 24px rgba(255,160,80,.7));
  }
  .mvp-rank-1 .mvp-tag {
    font-size: clamp(26px, 4vmin, 40px);
    text-shadow:
      0 0 28px rgba(255,180,120,.85),
      0 0 56px rgba(194,69,58,.55),
      0 2px 8px rgba(0,0,0,.9);
  }

  /* TOP II — secondary */
  .mvp-rank-2 {
    border-color: rgba(216,170,90,.5);
    background:
      radial-gradient(ellipse at top, rgba(70,18,12,.5) 0%, rgba(14,4,4,.55) 65%, rgba(8,2,2,.65) 100%);
  }
  .mvp-rank-2 .mvp-rank-numeral {
    font-size: clamp(36px, 6vmin, 64px);
    background-image: linear-gradient(180deg, #f3d8a0 0%, #b58a4a 50%, #6b4624 100%);
    filter: drop-shadow(0 0 16px rgba(216,170,90,.55));
  }

  /* TOP III — tertiary, slightly subdued */
  .mvp-rank-3 {
    border-color: rgba(180,140,60,.35);
    background:
      radial-gradient(ellipse at top, rgba(40,12,8,.5) 0%, rgba(12,4,4,.55) 70%, rgba(6,2,2,.65) 100%);
  }
  .mvp-rank-3 .mvp-rank-numeral {
    font-size: clamp(30px, 5vmin, 52px);
    background-image: linear-gradient(180deg, #d4b48a 0%, #8c6a3e 55%, #4c3a1f 100%);
    filter: drop-shadow(0 0 12px rgba(180,140,60,.4));
  }
  .mvp-tag {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(22px, 3.4vmin, 34px);
    letter-spacing: .15em;
    color: #fff;
    margin: 6px 0 8px;
    text-shadow:
      0 0 22px rgba(255,140,90,.7),
      0 0 44px rgba(194,69,58,.45);
  }
  .mvp-meta {
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(10px, 1.2vmin, 12px);
    letter-spacing: .45em;
    text-transform: uppercase;
    color: rgba(216,170,90,.75);
    margin-bottom: 28px;
    padding-left: .45em;
  }
  .mvp-meta .meta-dot {
    display: inline-block;
    width: 4px; height: 4px;
    background: rgba(216,170,90,.6);
    border-radius: 50%;
    margin: 0 12px;
    vertical-align: middle;
  }
  .mvp-text {
    font-family: Georgia, serif;
    font-style: italic;
    font-size: clamp(14px, 1.75vmin, 18px);
    line-height: 1.85;
    color: rgba(243,231,208,.92);
    max-width: 660px;
    margin: 0 auto;
    text-align: justify;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
  }

  /* ---------- Dashboard back button (top-left) ---------- */
  .dash-back {
    position: fixed;
    top: 22px; left: 22px;
    z-index: 80;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: rgba(20,6,6,.6);
    color: var(--parch);
    border: 1px solid rgba(194,69,58,.5);
    border-radius: 999px;
    font-family: 'Cinzel', Georgia, serif;
    font-size: clamp(10px, 1.3vmin, 13px);
    letter-spacing: .35em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all .25s ease;
    text-decoration: none;
  }
  .dash-back:hover {
    color: #fff;
    border-color: rgba(255,140,90,.85);
    box-shadow: 0 0 22px rgba(255,106,77,.5);
  }
  .dash-back svg { width: 14px; height: 14px; }

  /* Footer space so last MVP isn't crammed at viewport edge */
  .dash-foot { padding: 7vh 4vmin 6vh; text-align: center; }
  .dash-foot::before {
    content: "✦";
    display: block;
    font-size: 16px;
    color: rgba(216,170,90,.5);
    text-shadow: 0 0 14px rgba(255,106,77,.4);
  }

  @keyframes floatGently {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-9px); }
  }

  /* ---------- Mobile (portrait) ---------- */
  @media (max-aspect-ratio: 1/1) {
    body.view-lore .logo-cluster {
      width: min(38vmin, 320px);
      height: min(38vmin, 320px);
      top: 19vh;
      left: 50vw;
    }
    .timeline-wrap {
      left: 0;
      top: 38vh;
      padding: 1vh 5vw 3vh;
      max-width: 100%;
    }
    .timeline-title { margin-bottom: .8em; }
    .timeline { padding-left: 44px; }
    .timeline-track::before { left: -19px; }
    .ev::before { left: -26px; }
    .ev::after  { left: -14px; width: 18px; }
    .back-btn { top: 14px; left: 14px; }

    /* Dashboard mobile */
    body[class*="view-hh"] .logo-cluster {
      top: 14vh;
      width: min(34vmin, 240px);
      height: min(34vmin, 240px);
    }
    .hh-header { padding: 28vh 5vw 4vh; }
    .hh-section { padding: 5vh 5vw; }
    .lore-text { text-align: left; }
    .lore-text::first-letter { font-size: 3.4em; }
    .cast-factions,
    .cast-factions[data-factions="3"] { grid-template-columns: 1fr; gap: 7vh; max-width: 100%; }
    .mvp-list { gap: 28px; }
    .mvp-card { padding: 28px 22px; }
    .mvp-section-logo img { width: clamp(180px, 56vmin, 280px); }
    .dash-back { top: 14px; left: 14px; padding: 8px 14px; }
  }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    .ring-outer, .ring-mid, .ring-inner,
    .logo-glow, .logo,
    .cast-faction-sigil, .mvp-section-logo img { animation: none; }
  }
</style>

<body class="view-landing">
  <div class="bg bg-desktop"></div>
  <div class="bg bg-mobile"></div>
  <div class="vignette"></div>

  <canvas id="stars"></canvas>
  <canvas id="embers"></canvas>

  <div class="scene" id="scene">

    <!-- Logo cluster (rune rings + 3D logo). Moves to left column in lore view. -->
    <div class="logo-cluster" id="logoCluster">
      <div class="ring ring-outer" aria-hidden="true">

    hh7: {
      number: "HH7",
      title: "Ragnarok",
      time: "The Last Days of Helios",
      epigraph: [
        "“What if you can live forever but the one thing that can bring meaning to your life is something you shall never achieve?”",
        "This is the story of such a being."
      ],
      lore: [
        "Helios. Existing outside of time and space, this was a realm of gods. Those gods worshipped neither strength nor beauty; to them, knowledge was their pride, and to keep accumulating knowledge was to still be alive. How unusual, a place bursting with powers and gods with such mystical gifts, yet there is no war, no greed for more.",
        "The greatest of them, a god who saw everything that had been and everything that was coming, was called The Savant.",
        "Of everything the Savant ever did, only one thing was done without his knowing how it would end.",
        "He made an immortal serpent.",
        "He never said why, and nobody asked him. In Helios a god’s work was his own business, and the others had work of their own to mind.",
        "The Serpent was small enough to lie along his forearm, and he began to tell it things.",
        "He told it tales of the realm and of the gods’ works: how Oranheim had spent ages collecting the sounds stars make as they die, and could perform any of them from memory; how Isvet kept a list of every question no god had thought to ask yet, which made her hard company at gatherings; how Enra would conjure black holes to study true darkness. And many more. Above all of it, the Savant showed the Serpent the beautiful warmth of Helios, where dusk and dawn happen at the same time.",
        "For an eternity, that was its life. Basking in tales, and in the beauty and the warmth of Helios.",
        "Then the tales stopped.",
        "The Savant still let it lie along his forearm. But he had begun to do something with his attention that the Serpent had never seen him do. He looked tired in a way that should not have been possible for a god of his aptitude. He would begin a sentence and then stop midway.",
        "It waited. It had been taught patience by a god who had all of time laid out in front of him like a map.",
        "And the Savant finally told it.",
        "He had seen the end of Helios. The realm was dying from within, and nothing would be able to stop it. Ages of gathered knowledge had been poured into one place, and nothing that has ever been built can hold that much of anything. He said he had watched the weight of it settle. He said there would come a point, and he knew the hour of it, when Helios would tear in two. And during the tearing, natural disasters of a kind no power in the realm could answer.",
        "Gods dying.",
        "“Every future I can reach into, I have reached into. There is no hope for Helios.” He was quiet a while.",
        "That was the first grief of his long life, and the Serpent was the only one in the realm who saw it happen: not that the end was coming, but that he could see it coming from very far off and could not move it an inch.",
        "Ragnarok began at dusk.",
        "What the Serpent remembered afterward was not the tearing. The tearing was enormous and impersonal and in some way easier to hold than what followed. What it remembered was the wind.",
        "The wind came up out of the split and it carried sound. It carried sound from one edge of the realm to the other without losing any of it, so that every death in Helios was heard everywhere in Helios, all night, by everyone. No god died alone. No god was spared the hearing of another.",
        "The Serpent was immortal. It had been made that way without being asked, by a god who did not know how it would end. It could not die, and so, for as long as the ending lasted, it did the only thing available to it, which was to witness, perfectly, everything it had been taught to love coming apart.",
        "Helios had no word for what that was. They had never needed one.",
        "Near the end the Savant called it to him, and the Serpent found what was left of the gods standing in a ring, in the ruin of a place where it had once been shown something beautiful.",
        "They were making a new being, a vessel capable of holding more power than had ever been imagined, the first human, a man, and they were paying for him with themselves. It watched Oranheim’s gift go out of him and into the vessel on the ground, and watched him collapse. It watched gods it had been introduced to by name, one at a time, empty themselves out past the point where a god can remain a god. They gave until there was almost nothing left.",
        "The Savant was last. Before that, he spoke to the Serpent.",
        "“My son.” He had never called it that before, and he said it plainly, the way he had always stated things he had already checked. “You will not be given power the way the Man has been given it. Do not grieve that. Memory is a power of its own.”",
        "The Serpent did not understand, and there was no time left to tell it again in a different order.",
        "“As long as you remember us, and remember Helios for what it was, we are still alive. Carry it.”",
        "He had made it without knowing how it would end, and in all that eternity he had never once said what it was for. He said it now, in the last hour he had to say anything in, and the Serpent understood much later that this had not been foresight. It had been a decision.",
        "Then he went into the circle. The others had given their power. The Savant gave more than that: he poured every ounce of his being into the vessel, his gift and his knowledge and his sight and the body that had carried them, and he did not stop where the others had stopped, and he did not stop after that. He had nothing left to hold back for. He had already seen that there was no future in which he was needed.",
        "By the end there was nobody left to fall. The circle stood empty where he had been.",
        "And the Man opened his eyes.",
        "Afterward, the two halves of the realm drifted.",
        "One fell slowly toward dusk and kept falling. The other rose into a dawn, and the light coming off it was the light the Serpent had grown up in, and it hung there across the widening darkness like a symbol of hope.",
        "The survivors were all gathered there, along with the Man. The Serpent did not go. It could not bring itself to leave a part of Helios behind, and so it stayed with the other half.",
        "It looked up across the gap and watched the Man walk among them. He was beautiful. He carried the powers and the sacrifices of so many gods, and of the Savant himself, and when he raised his hand the weather obeyed him, which no god of Helios had ever managed, not once, not at the height of them.",
        "The Serpent’s hope in that moment was the largest thing it has ever held. It had seen the price paid in full. The gods had put the whole of Helios into this man so that Helios would go on, and here he stood, and the storms were already turning back.",
        "Then the Man looked across at the other half, the dark one, falling away.",
        "And he let it fall.",
        "The Serpent looked up with a lonely smile. It did not matter. Helios still had a future.",
        "The Man turned back to the gods on the bright half, the last of those who had made him, the ones who had poured their divinity into his body the night before, and he threw them out. He drove them across, all of them, down into the dark that was still drifting, and he did it without the slightest guilt. A haven wants no previous tenants. He meant to make a new life of his own shaping and to stand above it as one god, true and sole and unquestioned, and for that the bright half had to be emptied of anyone who remembered a time before him. Every god was struck with an immense confusion as they met, for the first time, greed.",
        "It was unforgivable. The Savior of Helios, the hope of the realm, had betrayed and abandoned his own creators.",
        "The dawn half came to be called Heaven. The other was called Hell.",
        "In Hell, without the Man’s protection, and having given most of their power away to him, the gods were slowly corrupted by the creeping darkness. The weaker ones were twisted into disgusting forms and became monsters. Those who could resist the change still had their sanity drained out of them a little at a time. Hardly anyone was the same as they had been in Helios. Only the strongest of the gods managed to hold on.",
        "And across the dark, close enough to see and never to reach, the bright half still hangs there holding the light it grew up in, under one god who will not let the fallen back in."
      ],

    hh8: {
      number: "HH8",
      title: "The Ancient War of Remnants",
      time: "Before Year 0",
      lore: [
        "Hell was sealed.",
        "Whatever the Man did to the dark half on the night he emptied the bright one, it left no way out. The gods searched and found no gate, no seam, no crack they could exploit. They had given him their power and he had used it to lock the door behind them.",
        "Imprisoned there, their wrath and hatred was the only thing in Hell that ever grew without being tended.",
        "Above, across a gap that only widened, he was building.",
        "He raised Heaven out of the corpse of Helios. He did not preserve it; he used it. The bright half had carried a realm once and now it carried another one. He filled it with laws, songs, and created winged children who would eventually forget they had been born out of something broken.",
        "He created another life form.",
        "Not gods, who were the only kind of being Helios had ever managed, and not winged children. He went back to the one design he trusted completely, his own body, an anatomy the best of the gods had built, and he made it again smaller and simpler. With no gifts and no powers injected into the vessel, what came out was a creature so fragile it could be killed by weather.",
        "He made a cradle to put them in. Beneath Heaven, under a sky so large that nothing in it could be reached from the ground, he set a small realm and called it Middle Earth, and he filled it with people.",
        "They worshipped him. There was no competition and no history, so he was the only god they ever knew, exactly what he had wanted from the night he emptied the bright half of everyone who could remember a time before him. They gave his winged children a name of their own and called them Angels. They built their accounts of the beginning of the world out of nothing but him.",
        "And he guarded them. From the remnants of the past, the gods locked away in Hell.",
        "But he was not immortal. Power is not endlessness, and his age was going to run out. He felt his time coming, and with that came the only piece of foresight he ever actually earned: he knew what would happen to his people the day he was no longer standing there. They were defenceless. He had made them that way on purpose. They had been given nothing with which to answer anything, because nothing was ever supposed to reach them.",
        "In his last hour he divided himself.",
        "He took what power he had left and he split it three ways and he put each part into a vessel, and he set the three of them over Middle Earth to watch it in his place. He called them Valkyries, and he gave each of them one piece of the work he would no longer be there to do.",
        "Brünnhilde, to shield Middle Earth from evil.",
        "Mist, to sense any danger falling toward humanity.",
        "Hildr, to foster life.",
        "It was the best he could do. It was also not enough, and he was not a stupid being; he must have known that, below him, sealed in the dark, were gods who had been nursing one grievance for the longest time with nothing else to occupy them, and the only thing that had ever held that down was him, undivided, present and personally attending to it. Three parts of him were not him. Fragments of a god are not a god.",
        "Then he was gone.",
        "In Hell time passed differently.",
        "There was no dawn to measure it against and nothing was built, so what the gods had instead was a cycle of suffering and anguish. Corrupted gods became monsters and attacked the others. The chaos had no seasons. Over all of it lay the darkness itself, which was not simply an absence of light but something with an appetite, and it worked on them slowly and without pause, without caring about the gods they once were.",
        "The Serpent helplessly watched it take them one at a time.",
        "The weaker gods lost themselves first. Their bodies came apart and reformed into something worse, and when the change was finished there was nothing inside left to talk to. The Serpent had known most of them by name. The stronger ones kept their faces and lost their minds instead, slowly, bit by bit as time passed, so that a god who answered the Serpent sensibly once would answer it the next time with something that had nothing to do with the question.",
        "The Serpent could not die, so it stayed, and it saw all of it.",
        "It also worked out, somewhere in the middle of that, that none of it could be fixed. Hell was not a sick place that might recover.",

  // ---------- Hall of Fame ----------
  const ALIAS = { 'Sourav5':'Sourav', 'Tragic Boy':'Tragicboy', 'Silver Mist':'Silvermist' };
  const aliasOf = t => ALIAS[t] || t;
  const HH_ORDER = ['hh1','hh2','hh3','hh4','hh5','hhx','hh6','hh7','hh8'];

  // HH1 was run twice. The second run — the Red/White rerun — has no surviving roster,
  // so its results are recorded here instead. They count toward a player's record only:

  // The chronicle does not track kills. Most deaths in the record have no named

  // the reason another was finished, because that is what makes a repeat mean

  const UNDOINGS = [
    { hh: 'HH2', by: 'Oldestdream', of: 'Sourav', how: 'Killed him outright' },
    { hh: 'HH5', by: 'Oldestdream', of: 'Sourav', how: 'Walked him into the Warden' },

  // Measured in chapter-days, which is why a half exists: HH6 resolved twice a day,
  // at dawn and at midday, so its midday was half a day in. Only a recorded
  // resolution counts — HH7's day-one loss was a withdrawal taken as the day's

  const SWIFT_ENDS = [
    { hh: 'HH6', tag: 'Tragicboy', day: 0.5, how: 'The Warden, destroyed at midday by his own Dullahan — before he had posted a single word.' },

  // Dying once ends a chapter for almost everyone. Dying twice means somebody spent a
  // revival on you, and dying three times means they did it again — so this is as much a
  // record of what a side was willing to pay as of how badly a player was hunted.
  const MULTI_DEATHS = [
    { hh: 'HH8', tag: 'Igris', deaths: 3, how: 'Killed on Day 1, executed on Day 4, killed again on Day 7. Sourav and Ssbakbar were both sacrificed to bring him back, and he finished the chapter without a single kill of his own.' },
    { hh: 'HH7', tag: 'Deva', deaths: 2, how: 'Lost his life on Day 4, won the vacated revival slot on rock-paper-scissors, and was gone again two days later.' },
